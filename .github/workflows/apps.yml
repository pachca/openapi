name: Apps SDK

# @pachca/app-sdk, @pachca/app-react and @pachca/create-app: one release, one
# CalVer number from releases.json (product `apps`), three publishes. A beta
# (`YYYY.M.N-beta.K`) goes out under the `next` dist-tag.

on:
  push:
    branches: [main]
    paths:
      - "packages/app-sdk/**"
      - "packages/app-react/**"
      - "packages/create-app/**"
      - "packages/app-tests/**"
      - "apps/docs/data/releases.json"
      - "scripts/check-release.mjs"
      - ".github/workflows/apps.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/app-sdk/**"
      - "packages/app-react/**"
      - "packages/create-app/**"
      - "packages/app-tests/**"
      - "packages/spec/openapi.yaml"
      - ".github/workflows/apps.yml"
  # Makes the first publish (after scripts/npm-bootstrap.mjs and the trusted
  # publisher, see docs/releases.md) and finishes a release whose publish failed.
  # check-release still decides whether to publish, and only main publishes.
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Types, `v`, contract fixtures, hooks, then the real apps: build, check,
      # template, create-app and the pachca-app binary against a fake API.
      - name: Test the packages
        run: bunx turbo run test --filter=@pachca/app-sdk --filter=@pachca/app-react --filter=@pachca/app-tests

  check-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
      dist_tag: ${{ steps.check.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      # The version of all three comes from releases.json; npm is asked about the SDK.
      - name: Check apps release
        id: check
        run: node scripts/check-release.mjs --product apps --npm @pachca/app-sdk --version-rule calver --allow-prerelease >> "$GITHUB_OUTPUT"

      - name: First publish needs a bootstrap
        if: steps.check.outputs.first_publish == 'true'
        run: |
          MSG="First publish: run scripts/npm-bootstrap.mjs for each package, add the trusted publishers, then run this workflow"
          echo "::notice title=@pachca/app-sdk is not on npm yet::${MSG} (docs/releases.md)"
          {
            echo "### @pachca/app-sdk is not on npm yet"
            echo
            echo "${MSG}:"
            echo
            echo "1. \`node scripts/npm-bootstrap.mjs packages/app-sdk\`, the same for \`packages/app-react\` and \`packages/create-app\`"
            echo "2. Trusted publisher on npmjs.com for each: GitHub Actions, \`pachca\` / \`openapi\`, workflow \`apps.yml\`, no environment"
            echo "3. Within 48 hours: \`gh workflow run apps.yml --ref main\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check-release.outputs.should_publish == 'true'
    needs: [test, check-release]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-apps
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      # setup-node v7 is what makes trusted publishing work (see mcp-manifest.yml).
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile

      # The packages keep 0.0.0 in the repository. The release number goes into
      # all three, and `workspace:*` (which npm does not rewrite) becomes that
      # exact number: app-react and the apps create-app makes take the SDK of
      # their own release.
      - name: Set the version (from releases.json)
        env:
          VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            for (const dir of ["packages/app-sdk", "packages/app-react", "packages/create-app"]) {
              const file = `${dir}/package.json`;
              const p = JSON.parse(fs.readFileSync(file, "utf8"));
              p.version = process.env.VERSION;
              for (const deps of [p.dependencies, p.peerDependencies]) {
                for (const name of Object.keys(deps ?? {})) if (deps[name].startsWith("workspace:")) deps[name] = process.env.VERSION;
              }
              fs.writeFileSync(file, JSON.stringify(p, null, 2) + "\n");
            }
          '

      - name: Build
        run: bunx turbo run build --filter=@pachca/app-sdk --filter=@pachca/app-react --filter=@pachca/create-app

      # SDK first: app-react and create-app point at it. Each publish is
      # idempotent, so a rerun finishes a release that broke halfway.
      # Authenticated via OIDC (trusted publisher), provenance is attached automatically.
      - name: Publish to npm (idempotent)
        env:
          VERSION: ${{ needs.check-release.outputs.version }}
          DIST_TAG: ${{ needs.check-release.outputs.dist_tag }}
        run: |
          for pkg in app-sdk app-react create-app; do
            if npm view "@pachca/${pkg}@${VERSION}" version 2>/dev/null; then
              echo "@pachca/${pkg}@${VERSION} already published, skipping"
            else
              (cd "packages/${pkg}" && npm publish --access public --tag "${DIST_TAG}" --ignore-scripts)
            fi
          done
