name: MCP manifest

on:
  push:
    branches: [main]
    paths:
      - "packages/mcp-manifest/**"
      - "scripts/check-mcp-manifest.mjs"
      - ".github/workflows/mcp-manifest.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/mcp-manifest/**"
      - "packages/spec/mcp-manifest.json"
      - "packages/spec/mcp-manifest.schema.json"
      - "scripts/check-mcp-manifest.mjs"
      - ".github/workflows/mcp-manifest.yml"
  # Makes the first publish of the package (after scripts/npm-bootstrap.mjs and
  # the trusted publisher, see docs/releases.md) and finishes a release whose
  # publish failed, without waiting for the next push that touches the package.
  # check-release still decides whether to publish, and only main publishes.
  workflow_dispatch:

concurrency:
  group: mcp-manifest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Compiles the spec, applies the English overlay, generates the manifest
      # in packages/spec and copies it with its schema into the package.
      - name: Build the manifest from the spec
        run: bunx turbo run build --filter=@pachca/mcp-manifest

      # The tarball ships the committed copies: they have to be exactly what the
      # spec generates, or the release would carry a stale set.
      - name: Package files are in sync with the spec
        run: |
          git diff --exit-code -- packages/mcp-manifest
          test -z "$(git status --porcelain -- packages/mcp-manifest)"

      # Ajv2020 on the files that ship, as a server validates them at start,
      # and the major step when the schema_version major moves (against the
      # `latest` release on npm).
      - name: Validate the manifest against its schema and the versioning rule
        run: node scripts/check-mcp-manifest.mjs --against-npm

  check-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      # The package is not on the portal: the version is in its package.json
      # and has to be in its CHANGELOG.md.
      - name: Check MCP manifest release (changelog-driven)
        id: check
        run: node scripts/check-release.mjs --product mcp-manifest --npm @pachca/mcp-manifest --package-dir packages/mcp-manifest >> "$GITHUB_OUTPUT"

      # Trusted publishing cannot create a package, so while it is not on npm
      # the publish is skipped and the run stays green.
      - name: First publish needs a bootstrap
        if: steps.check.outputs.first_publish == 'true'
        run: |
          MSG="First publish: run scripts/npm-bootstrap.mjs, add the trusted publisher, then run this workflow"
          echo "::notice title=@pachca/mcp-manifest is not on npm yet::${MSG} (docs/releases.md)"
          {
            echo "### @pachca/mcp-manifest is not on npm yet"
            echo
            echo "${MSG}:"
            echo
            echo "1. \`node scripts/npm-bootstrap.mjs packages/mcp-manifest\`"
            echo "2. Trusted publisher on npmjs.com: GitHub Actions, \`pachca\` / \`openapi\`, workflow \`mcp-manifest.yml\`, no environment"
            echo "3. Within 48 hours: \`gh workflow run mcp-manifest.yml --ref main\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.check-release.outputs.should_publish == 'true'
    needs: [validate, check-release]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-mcp-manifest
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # setup-node v7 is what makes trusted publishing work: earlier versions
      # write an empty `_authToken` line into .npmrc whenever registry-url is
      # set and NODE_AUTH_TOKEN is not, and npm then treats auth as configured
      # and never starts the OIDC exchange. Node 24 ships npm 11.19, above the
      # 11.5.1 trusted publishing needs, so npm is not upgraded by hand.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Nothing to build or stamp: the package is the committed files, checked
      # by the validate job on this same commit, and its package.json already
      # carries the version that check-release accepted.
      #
      # Authenticated via OIDC (trusted publisher configured on npmjs), not a
      # token. Provenance is attached automatically, so --provenance is dropped.
      - name: Publish to npm (idempotent)
        working-directory: packages/mcp-manifest
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          if npm view "@pachca/mcp-manifest@${VERSION}" version 2>/dev/null; then
            echo "@pachca/mcp-manifest@${VERSION} already published, skipping"
          else
            npm publish --access public --ignore-scripts
          fi
