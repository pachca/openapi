openapi: 3.0.0
info:
  title: Pachca API
  version: 1.0.0
tags:
  - name: OAuth
  - name: Chats
  - name: Profile
  - name: Users
  - name: Group tags
  - name: Members
  - name: Threads
  - name: Messages
  - name: Read members
  - name: Reactions
  - name: Search
  - name: Tasks
  - name: Drafts
  - name: Views
  - name: Bots
  - name: Security
  - name: Custom Properties
  - name: Files
paths:
  /audit_events:
    get:
      operationId: SecurityOperations_getAuditEvents
      description: >-
        Audit event log


        What has been happening in the workspace: sign-ins and sign-outs, changes of roles and settings, actions on
        chats, employees, and bots. The records are read-only — they cannot be changed or deleted either through the API
        or from the interface.


        The method is available to the workspace owner on the "Corporation" plan; other employees receive `403`.
        Accessing the audit log is itself written to the audit log — as the `audit_events_accessed` event.


        Events come from newest to oldest and are selected with filters: the period by `start_time` and `end_time`, the
        kind of event by `event_key`, and the actor by `actor_id` and `actor_type`. Without filters the method returns
        all events of the workspace page by page.
      parameters:
        - name: start_time
          in: query
          required: false
          description: >-
            Start timestamp, inclusive (ISO-8601). An offset such as `+03:00` is taken into account, and a time without
            an offset is treated as UTC. A value that could not be parsed removes the filter — the response comes in
            full, without an error.
          schema:
            type: string
            format: date-time
            example: '2025-05-01T09:11:00.000Z'
          example: '2025-05-01T09:11:00.000Z'
          explode: false
        - name: end_time
          in: query
          required: false
          description: >-
            End timestamp, inclusive (ISO-8601). An offset such as `+03:00` is taken into account, and a time without an
            offset is treated as UTC. A value that could not be parsed removes the filter — the response comes in full,
            without an error.
          schema:
            type: string
            format: date-time
            example: '2025-05-02T09:11:00.000Z'
          example: '2025-05-02T09:11:00.000Z'
          explode: false
        - name: event_key
          in: query
          required: false
          description: Filter by specific event type
          schema:
            $ref: '#/components/schemas/AuditEventKey'
            example: user_login
          example: user_login
          explode: false
        - name: actor_id
          in: query
          required: false
          description: ID of the user who performed the action
          schema:
            type: string
            example: '98765'
          example: '98765'
          explode: false
        - name: actor_type
          in: query
          required: false
          description: Actor type
          schema:
            type: string
            example: User
          example: User
          explode: false
        - name: entity_id
          in: query
          required: false
          description: ID of the affected entity
          schema:
            type: string
            example: '98765'
          example: '98765'
          explode: false
        - name: entity_type
          in: query
          required: false
          description: Entity type
          schema:
            type: string
            example: User
          example: User
          explode: false
        - name: limit
          in: query
          required: false
          description: Number of records to return
          schema:
            type: integer
            format: int32
            maximum: 50
            example: 1
            default: 50
          example: 1
          explode: false
        - name: cursor
          in: query
          required: false
          description: Pagination cursor (from `meta.paginate.next_page` or `meta.paginate.prev_page`)
          schema:
            type: string
            example: eyJpZCI6MTAsImRpciI6ImFzYyJ9
          example: eyJpZCI6MTAsImRpciI6ImFzYyJ9
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                description: Response wrapper with data and pagination
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '402':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Security
      x-paginated: true
      x-requirements:
        scope: audit_events:read
        plan: corporation
  /bot/recreate_token:
    post:
      operationId: BotOperations_selfRecreateBotToken
      description: >-
        Bot self token rotation


        Allows a bot to generate a new `access_token` for itself using its own token — without an administrator and
        without knowing its own `id`.


        The very token the request was made with is rotated, and it is invalidated immediately.


        The new token is returned in the response once — be sure to save it, otherwise the bot loses access to the API.
        The scopes are carried over from the previous token.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/BotCreateResponse'
                description: Response wrapper with data
              example:
                data:
                  id: 1738816
                  webhook:
                    name: Tasks bot
                    nickname: tasks_bot
                    outgoing_url: https://www.website.com/tasks/new
                    events:
                      - message_new
                    trigger_on: commands
                    commands:
                      - /task
                    scopes:
                      - messages:create
                    template: Order from {{ client }} for {{ amount }} ₽
                    template_engine: liquid
                    challenge_key: challenge
                    link_preview_enabled: true
                    ignore_self_messages: false
                    events_history_enabled: false
                    single_chat: false
                    can_edit:
                      - admin
                    who_can_add: creator
                  access_token: bm90X2FfcmVhbF90b2tlbg
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '402':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Bots
      x-requirements:
        scope: bot_self:write
  /bot/webhook:
    put:
      operationId: BotOperations_selfUpdateBotWebhook
      description: >-
        Bot webhook self-registration


        Allows a bot to change its own outgoing webhook `URL` using its own token — without an administrator and without
        knowing its own `id`. The webhook of the bot that owns the token is changed. To disable the webhook, send an
        empty string in `outgoing_url`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/BotResponse'
                description: Response wrapper with data
              example:
                data:
                  id: 1738816
                  webhook:
                    name: Tasks bot
                    nickname: tasks_bot
                    outgoing_url: https://www.website.com/tasks/new
                    events:
                      - message_new
                    trigger_on: commands
                    commands:
                      - /task
                    scopes:
                      - messages:create
                    template: Order from {{ client }} for {{ amount }} ₽
                    template_engine: liquid
                    challenge_key: challenge
                    link_preview_enabled: true
                    ignore_self_messages: false
                    events_history_enabled: false
                    single_chat: false
                    can_edit:
                      - admin
                    who_can_add: creator
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '402':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Bots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotWebhookSelfUpdateRequest'
            example:
              webhook:
                outgoing_url: https://www.website.com/tasks/new
      x-requirements:
        scope: bot_self:webhook:write
  /bots:
    get:
      operationId: BotOperations_listBots
      description: >-
        List bots


        The bots the caller is entitled to configure: those they created themselves and those whose settings grant them
        edit access.


        The `query` parameter selects bots by part of the name, without typos. Bot tokens do not come in the list — they
        are shown once at creation and at rotation.


        The list of all bots in the workspace, including other people's, is available to the owner on the "Corporation"
        plan — [List workspace bots](GET /company/bots). There other people's bots come with only a name and a nickname,
        and the rest of the settings are hidden.
      parameters:
        - name: query
          in: query
          required: false
          description: Search phrase to filter bots by name
          schema:
            type: string
            example: task
          example: task
          explode: false
        - name: limit
          in: query
          required: false
          description: Number of entities returned per request
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
            example: 1
            default: 50
          example: 1
          explode: false
        - name: cursor
          in: query
          required: false
          description: Pagination cursor (from `meta.paginate.next_page`)
          schema:
            type: string
            example: eyJpZCI6MTczODgxNn0
          example: eyJpZCI6MTczODgxNn0
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BotResponse'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
                description: Response wrapper with data and pagination
              example:
                data:
                  - id: 1738816
                    webhook:
                      name: Tasks bot
                      nickname: tasks_bot
                      outgoing_url: https://www.website.com/tasks/new
                      events:
                        - message_new
                      trigger_on: commands
                      commands:
                        - /task
                      scopes:
                        - messages:create
                      template: Order from {{ client }} for {{ amount }} ₽
                      template_engine: liquid
                      challenge_key: challenge
                      link_preview_enabled: true
                      ignore_self_messages: false
                      events_history_enabled: false
                      single_chat: false
                      can_edit:
                        - admin
                      who_can_add: creator
                meta:
                  paginate:
                    next_page: eyJpZCI6MTczODgxNn0
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '402':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
      tags:
        - Bots
      x-paginated: true
      x-requirements:
        scope: bots:read
    post:
      operationId: BotOperations_createBot
      description: >-
        New bot


        Creates a bot in the workspace and immediately returns its `access_token`. Save the token at creation: the same
        one is not shown again, and what remains is to reissue it with [Bot token rotation](POST
        /bots/{id}/recreate_token).


        A newly created bot does not write anywhere yet. It writes into a conversation and a channel only as a member,
        and it is added like an employee — with the [Add users](POST /chats/{id}/members) method, passing the bot's
        `id`. In a channel the bot receives the editor role. Direct messages and threads in public chats do not require
        membership.


        The bot's incoming webhook sends a message at once to every conversation and channel the bot belongs to, so it
        is the set of its chats that decides where it lands. No token is needed for that, the webhook address is enough.
        To write into one particular chat, take the [New message](POST /messages) method — that one does need a token.


        The nickname must end with `_bot` and be free in the workspace. The `single_chat` restriction is set only here:
        when editing a bot it can no longer be changed.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/BotCreateResponse'
                description: Response wrapper with data
              example:
                data:
                  id: 1738816
                  webhook:
                    name: Tasks bot
                    nickname: tasks_bot
                    outgoing_url: https://www.website.com/tasks/new
                    events:
                      - message_new
                    trigger_on: commands
                    commands:
                      - /task
                    scopes:
                      - messages:create
                    template: Order from {{ client }} for {{ amount }} ₽
                    template_engine: liquid
                    challenge_key: challenge
                    link_preview_enabled: true
                    ignore_self_messages: false
                    events_history_enabled: false
                    single_chat: false
                    can_edit:
                      - admin
                    who_can_add: creator
                  access_token: bm90X2FfcmVhbF90b2tlbg
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '402':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
      tags:
        - Bots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotCreateRequest'
            example:
              webhook:
                name: Tasks bot
                nickname: tasks_bot
                outgoing_url: https://www.website.com/tasks/new
                events:
                  - message_new
                trigger_on: commands
                commands:
                  - /task
                scopes:
                  - messages:create
      x-requirements:
        scope: bots:write
  /bots/{id}:
    get:
      operationId: BotOperations_getBot
      description: >-
        Bot info


        The bot's settings. The token does not come in the response — it is shown once at the bot's creation and at [Bot
        token rotation](POST /bots/{id}/recreate_token).


        The method returns only the bots the caller is entitled to configure: their own, and, if the bot's settings
        allow it, also as a workspace administrator or as the owner of a chat the bot belongs to. For someone else's bot
        the method responds `403`.


        The list of all bots in the workspace, including other people's, is available to the owner on the "Corporation"
        plan — [List workspace bots](GET /company/bots).
      parameters:
        - name: id
          in: path
          required: true
          description: Bot ID
          schema:
            type: integer
            format: int32
            example: 1738816
          example: 1738816
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/BotResponse'
                description: Response wrapper with data
              example:
                data:
                  id: 1738816
                  webhook:
                    name: Tasks bot
                    nickname: tasks_bot
                    outgoing_url: https://www.website.com/tasks/new
                    events:
                      - message_new
                    trigger_on: commands
                    commands:
                      - /task
                    scopes:
                      - messages:create
                    template: Order from {{ client }} for {{ amount }} ₽
                    template_engine: liquid
                    challenge_key: challenge
                    link_preview_enabled: true
                    ignore_self_messages: false
                    events_history_enabled: false
                    single_chat: false
                    can_edit:
                      - admin
                    who_can_add: creator
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '402':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Bots
      x-requirements:
        scope: bots:read
    put:
      operationId: BotOperations_updateBot
      description: >-
        Edit bot


        Changes a bot's settings: only the fields you pass are overwritten.


        The `single_chat` field is accepted only when a bot is created. In this method it is silently ignored: the
        response is successful and the bot's mode does not change.


        The nickname must end with `_bot` and be free in the workspace, otherwise the method responds with a validation
        error. Commands and scopes are replaced by the passed list as a whole, and the new set of scopes is applied to
        the bot's current token right away — there is no need to reissue it.


        You cannot edit a bot whose settings are not accessible to you (the "Who can edit bot settings" field is located
        on the "General" tab in the bot settings).
      parameters:
        - name: id
          in: path
          required: true
          description: Bot ID
          schema:
            type: integer
            format: int32
            example: 1738816
          example: 1738816
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/BotResponse'
                description: Response wrapper with data
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '402':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Bots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BotUpdateRequest'
      x-requirements:
        scope: bots:write
    delete:
      operationId: BotOperations_deleteBot
      description: >-
        Delete bot


        Delete a bot. The bot's previous `access_token` is invalidated immediately, the bot is removed from all chats,
        and its outgoing webhook is deleted.


        Deletion is available to the bot creator, and to a workspace administrator if the bot's settings grant
        administrators edit access. Chat owners and admins cannot delete a bot, even if they are allowed to edit it.
      parameters:
        - name: id
          in: path
          required: true
          description: Bot ID
          schema:
            type: integer
            format: int32
            example: 1738816
          example: 1738816
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '402':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Bots
      x-requirements:
        scope: bots:write
  /bots/{id}/recreate_token:
    post:
      operationId: BotOperations_recreateBotToken
      description: >-
        Bot token rotation


        Generates a new `access_token` for the bot and immediately invalidates the previous one. Use it when a token is
        compromised or for scheduled secret rotation in `CI`.


        The new token is returned in the response only once — save it right away. Its permissions are the same: the
        scopes are carried over from the previous token.


        Rotation is available to the bot creator, and also to a workspace administrator if the bot's settings grant
        administrators edit access. The owner of a chat the bot belongs to cannot rotate the token, even when the rest
        of the bot's settings are open to them.
      parameters:
        - name: id
          in: path
          required: true
          description: Bot ID
          schema:
            type: integer
            format: int32
            example: 1738816
          example: 1738816
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/BotCreateResponse'
                description: Response wrapper with data
              example:
                data:
                  id: 1738816
                  webhook:
                    name: Tasks bot
                    nickname: tasks_bot
                    outgoing_url: https://www.website.com/tasks/new
                    events:
                      - message_new
                    trigger_on: commands
                    commands:
                      - /task
                    scopes:
                      - messages:create
                    template: Order from {{ client }} for {{ amount }} ₽
                    template_engine: liquid
                    challenge_key: challenge
                    link_preview_enabled: true
                    ignore_self_messages: false
                    events_history_enabled: false
                    single_chat: false
                    can_edit:
                      - admin
                    who_can_add: creator
                  access_token: bm90X2FfcmVhbF90b2tlbg
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '402':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Bots
      x-requirements:
        scope: bots:write
  /chats:
    post:
      operationId: ChatOperations_createChat
      description: >-
        New chat


        Creates a conversation or a channel. The token owner becomes the chat owner, and this role is not transferred
        later on.


        A multi-guest cannot create chats, as in the interface: the method responds `403` to them.


        To create a one-on-one direct message with a user, use the [New message](POST /messages) method. To discuss a
        particular message there is no need to create a chat — a thread is started under it with the [New thread](POST
        /messages/{id}/thread) method.


        Members can be passed right away: `member_ids` adds them one by one, `group_tag_ids` brings in everyone who
        belongs to the tag and keeps the membership up to date afterwards. IDs that do not exist in the workspace, as
        well as suspended and deleted employees, are silently dropped — the response is successful but the employee is
        not in the chat, so check the membership in the response. Bots are stricter: if a bot's "Who can add the bot to
        chats" setting does not let you add it, the chat is not created, and the method responds `403` with the
        `bot_add_denied` code and the IDs of such bots in `value`.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
