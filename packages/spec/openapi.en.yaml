    OpenViewRequest:
      type: object
      required:
        - type
        - trigger_id
        - view
      properties:
        type:
          type: string
          enum:
            - modal
          description: View opening method
          example: modal
          x-enum-descriptions:
            modal: Modal window
        trigger_id:
          type: string
          description: Unique event identifier (received, for example, in the outgoing webhook for a button click)
          example: 791a056b-006c-49dd-834b-c633fde52fe8
        private_metadata:
          type: string
          maxLength: 3000
          description: >-
            Optional string that will be sent to your application when the user submits the form. Use this field, for
            example, to pass additional information in `JSON` format along with the form data.
          example: '{"timeoff_id":4378}'
        callback_id:
          type: string
          maxLength: 255
          description: >-
            Optional identifier for recognizing this view, which will be sent to your application when the user submits
            the form. Use this field, for example, to determine which form the user was supposed to fill out.
          example: timeoff_request_form
        view:
          type: object
          properties:
            title:
              type: string
              maxLength: 24
              description: View title
              example: Vacation notification
            close_text:
              type: string
              maxLength: 24
              description: Close button text
              example: Close
              default: Cancel
            submit_text:
              type: string
              maxLength: 24
              description: Submit button text
              example: Submit request
              default: Submit
            blocks:
              type: array
              items:
                $ref: '#/components/schemas/ViewBlockUnion'
              maxItems: 100
              description: Array of view blocks
          required:
            - title
            - blocks
          description: View object
      description: View
    PaginationMeta:
      type: object
      required:
        - paginate
      properties:
        paginate:
          type: object
          properties:
            next_page:
              type: string
              description: Next page pagination cursor
              example: eyJxZCO2MiwiZGlyIjomSNYjIn3
            prev_page:
              type: string
              description: Previous page pagination cursor. Used for polling new records "above" the list
              example: eyJxZCO2MiwiZGlyIjoiYXNjIn0
            has_next:
              type: boolean
              description: Whether more data exists on the next page. `false` on the last page
              example: true
            has_prev:
              type: boolean
              description: Whether more data exists on the previous page. `false` on the first request without a cursor
              example: false
          required:
            - next_page
          description: Helper information
      description: Pagination metadata
    Reaction:
      type: object
      required:
        - user_id
        - created_at
        - code
        - name
      properties:
        user_id:
          type: integer
          format: int32
          description: ID of the user who added the reaction
          example: 12
        created_at:
          type: string
          format: date-time
          description: Reaction creation date and time (ISO-8601, UTC+0) in YYYY-MM-DDThh:mm:ss.sssZ format
          example: '2024-01-20T10:30:00.000Z'
        code:
          type: string
          description: Reaction emoji character
          example: 👍
        name:
          type: string
          description: Reaction emoji name
          example: ':+1::skin-tone-1:'
      description: Message reaction
    ReactionEventType:
      type: string
      enum:
        - new
        - delete
      description: Webhook event type for reactions
      x-enum-descriptions:
        new: Created
        delete: Deleted
    ReactionRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: >-
            Reaction emoji character. The character itself: text forms such as `+1` or `:+1:` are rejected as an unknown
            emoji.
          example: 👍
        name:
          type: string
          description: Emoji text name (used for custom emoji)
          example: ':+1:'
      description: Reaction creation request
    ReactionWebhookPayload:
      type: object
      required:
        - type
        - event
        - chat_id
        - message_id
        - code
        - name
        - user_id
        - created_at
        - webhook_timestamp
      properties:
        type:
          type: string
          enum:
            - reaction
          description: Object type
          example: reaction
          x-enum-descriptions:
            reaction: Always reaction for reactions
        event:
          allOf:
            - $ref: '#/components/schemas/ReactionEventType'
          description: Event type
          example: new
        chat_id:
          type: integer
          format: int32
          nullable: true
          description: >-
            ID of the chat that contains the message. The field is always present in the payload; in rare cases (for
            example, if the message was deleted before the webhook was dispatched) it may be `null`.
          example: 9012
        message_id:
          type: integer
          format: int32
          description: ID of the message the reaction belongs to
          example: 1245817
        code:
          type: string
          description: Reaction emoji character
          example: 👍
        name:
          type: string
          description: Reaction name
          example: thumbsup
        user_id:
          type: integer
          format: int32
          description: ID of the user who added or removed the reaction
          example: 2345
        created_at:
          type: string
          format: date-time
          description: >-
            Reaction creation date and time (ISO-8601, UTC+0) in YYYY-MM-DDThh:mm:ss.sssZ format. The field is also
            present for the reaction-removed event.
          example: '2025-05-15T14:30:00.000Z'
        webhook_timestamp:
          type: integer
          format: int32
          description: Webhook send date and time (UTC+0) in UNIX format
          example: 1747574400
      description: Outgoing webhook payload for reactions
