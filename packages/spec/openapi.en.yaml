        scopes:
          type: array
          items:
            type: string
          description: Scopes the client requested
      description: 'For: oauth_device_authorization_denied'
    AuditDetailsDlp:
      type: object
      required:
        - dlp_rule_id
        - dlp_rule_name
        - message_id
        - chat_id
        - user_id
        - action_message
        - conditions_matched
      properties:
        dlp_rule_id:
          type: integer
          format: int32
          description: DLP rule ID
        dlp_rule_name:
          type: string
          description: DLP rule name
        message_id:
          type: integer
          format: int32
          description: Message ID
        chat_id:
          type: integer
          format: int32
          description: Chat ID
        user_id:
          type: integer
          format: int32
          description: User ID
        action_message:
