        The status of another employee: the emoji, the title, the expiry, and away mode.


        For a multi-guest the method returns statuses only of those who come to them in [List employees](GET /users),
        and responds `404` for the rest.


        If no status is set, the method returns `200` and `null` in the response body — with no wrapper object. A status
        whose `expires_at` has passed may still be returned for a short time until it is cleared, so check `expires_at`
        on the client side.
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int32
            example: 12
          example: 12
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserStatus'
                description: Response wrapper with data
                nullable: true
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Users
      x-requirements:
        scope: user_status:read
    put:
      operationId: UserStatusOperations_updateUserStatus
      description: >-
        New employee status


        Sets a status for another employee — for example, "on vacation" for the time of their absence. Available to the
        workspace owner and an administrator; not to a bot, even with the scope.


        This same method turns on away mode for that employee with the `is_away` flag and sets the `away_message` text
        that anyone reaching out to them will see.


        The status is seen by everyone who sees the employee in the workspace. Only the fields you pass are overwritten,
        so someone else's status can be extended with `expires_at` alone.


        An expiry named in words is `expires_at`, not a part of the caption, and it is counted in the time zone of the
        employee the status is set for. The emoji is required and there must be exactly one; the caption is required and
        no longer than 50 characters.


        Your own status is set by the [New own status](PUT /profile/status) method — it is available to all roles and to
        bots.
      parameters:
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            format: int32
            example: 12
          example: 12
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserStatus'
                description: Response wrapper with data
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
      x-requirements:
        scope: user_status:write
    delete:
      operationId: UserStatusOperations_deleteUserStatus
      description: >-
        Delete employee status


        Removes the status from another employee, along with away mode and its text. Available to the workspace owner
        and an administrator; not to a bot.


        If there was no status, the response is still `204`. Your own status is removed by [Delete own status](DELETE
        /profile/status).
      parameters:
