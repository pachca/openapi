    StatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: object
          properties:
            emoji:
              type: string
              description: Status emoji character
              example: 🎮
            title:
              type: string
              maxLength: 50
              description: Status text
              example: Very busy
            expires_at:
              type: string
              format: date-time
              description: >-
                Status expiration date and time (ISO-8601). An offset such as `+03:00` is taken into account, and a time
                without an offset is read as UTC. A deadline the person names in words goes here: «until three» is the
                value of this field, not part of the title.
              example: '2024-04-08T10:00:00.000Z'
            is_away:
              type: boolean
              description: Whether to enable "Away" mode
              example: true
            away_message:
              type: string
              maxLength: 1024
              description: '"Away" mode message text. Displayed in the profile and in direct messages/mentions.'
              example: Back after 3 PM
          required:
            - emoji
            - title
      description: Status update request
