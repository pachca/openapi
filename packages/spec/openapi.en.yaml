        - cursor_present
        - limit
        - filters
      properties:
        search_type:
          type: string
          description: Search type
        query_present:
          type: boolean
          description: Whether a search query was specified
        cursor_present:
          type: boolean
          description: Whether a cursor was used
        limit:
          type: integer
          format: int32
          description: Number of returned results
        filters:
          type: object
          additionalProperties: {}
