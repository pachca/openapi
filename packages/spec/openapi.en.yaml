          example: Upload the completed application with an electronic signature (in pdf, jpg, or png format)
      description: File input block — file upload
    ViewBlockHeader:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - header
          description: Block type
          example: header
          x-enum-descriptions:
            header: Always header for headings
        text:
          type: string
          maxLength: 150
          description: Header text
          example: General information
      description: Header block — heading
    ViewBlockInput:
      type: object
      required:
        - type
        - name
        - label
      properties:
        type:
          type: string
          enum:
            - input
          description: Block type
          example: input
          x-enum-descriptions:
            input: Always input for text fields
        name:
          type: string
          maxLength: 255
          description: Name that will be sent to your application as the key for the user-specified value
          example: info
        label:
          type: string
          maxLength: 150
          description: Field label
          example: Vacation description
        placeholder:
          type: string
          maxLength: 150
          description: Placeholder text inside the input field while it is empty
          example: Where are you going and what will you be doing
        multiline:
          type: boolean
          description: Multiline field
          example: true
          default: false
        initial_value:
          type: string
          maxLength: 3000
          description: Initial field value
          example: Initial text
        min_length:
          type: integer
          format: int32
          minimum: 0
          maximum: 3000
          description: Minimum text length the user must enter. If the user enters less, they will receive an error.
          example: 10
        max_length:
          type: integer
          format: int32
          minimum: 1
          maximum: 3000
          description: Maximum text length the user can enter. If the user enters more, they will receive an error.
          example: 500
        required:
          type: boolean
          description: Required
          example: true
          default: false
        hint:
          type: string
          maxLength: 2000
          description: Hint displayed below the field in gray
          example: Others might suggest the best places to visit
      description: Input block — text input field
    ViewBlockMarkdown:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - markdown
          description: Block type
          example: markdown
          x-enum-descriptions:
            markdown: Always markdown for formatted text
        text:
          type: string
          maxLength: 12000
          description: Text
          example: You can read about your available vacation days at [this link](https://www.website.com/timeoff)
      description: Markdown block — formatted text
    ViewBlockPlainText:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - plain_text
          description: Block type
          example: plain_text
          x-enum-descriptions:
            plain_text: Always plain_text for plain text
        text:
          type: string
          maxLength: 12000
          description: Text
          example: >-
            Fill out the form. After submitting, a text notification will be sent to the general chat, and your vacation
            will be saved in the database.
      description: Plain text block — plain text
    ViewBlockRadio:
      type: object
      required:
        - type
        - name
        - label
        - options
      properties:
        type:
          type: string
          enum:
            - radio
          description: Block type
          example: radio
          x-enum-descriptions:
            radio: Always radio for radio buttons
        name:
          type: string
          maxLength: 255
          description: Name that will be sent to your application as the key for the user-selected choice
          example: accessibility
        label:
          type: string
          maxLength: 150
          description: Radio button group label
          example: Availability
        options:
          type: array
          items:
            $ref: '#/components/schemas/ViewBlockSelectableOption'
          minItems: 1
          maxItems: 10
          description: Array of radio buttons
        required:
          type: boolean
          description: Required
          example: true
          default: false
        hint:
          type: string
          maxLength: 2000
          description: Hint displayed below the radio button group in gray
          example: If you do not plan to be available, select None
      description: Radio block — radio buttons
    ViewBlockSelect:
      type: object
      required:
        - type
        - name
        - label
        - options
      properties:
        type:
          type: string
          enum:
            - select
          description: Block type
          example: select
          x-enum-descriptions:
            select: Always select for dropdowns
        name:
          type: string
          maxLength: 255
          description: Name that will be sent to your application as the key for the user-selected choice
          example: team
        label:
          type: string
          maxLength: 150
          description: Dropdown label
          example: Select a team
        options:
          type: array
          items:
            $ref: '#/components/schemas/ViewBlockSelectOption'
          minItems: 1
          maxItems: 100
          description: Array of available items in the dropdown
        required:
          type: boolean
          description: Required
          example: false
          default: false
        hint:
          type: string
          maxLength: 2000
          description: Hint displayed below the dropdown in gray
          example: Select one of the teams
      description: Select block — dropdown
    ViewBlockSelectOption:
      type: object
      required:
        - text
        - value
      properties:
        text:
          type: string
          maxLength: 75
          description: Select option label text
          example: None
        value:
          type: string
          maxLength: 255
          description: Select option value
          example: nothing
        description:
          type: string
          maxLength: 75
          description: Select option description
          example: Every day the bot will send a list of new tasks in your team
        selected:
          type: boolean
          description: Whether this select option is selected by default
          example: true
      description: >-
        Dropdown (select) option. The initial choice is set with `selected`, not with `checked`, as in radio and
        checkbox.
    ViewBlockSelectableOption:
      type: object
      required:
        - text
        - value
      properties:
        text:
          type: string
          maxLength: 75
          description: Radio option label text
          example: None
        value:
          type: string
          maxLength: 255
          description: Radio option value
          example: nothing
        description:
          type: string
          maxLength: 75
          description: Radio option description
          example: Every day the bot will send a list of new tasks in your team
        checked:
          type: boolean
          description: Whether this radio option is selected by default
          example: true
      description: >-
        Radio button of a radio block. The initial choice is set with `checked`, as in checkbox, not with `selected`, as
        in select.
    ViewBlockTime:
      type: object
      required:
        - type
        - name
        - label
      properties:
        type:
          type: string
          enum:
            - time
          description: Block type
          example: time
          x-enum-descriptions:
            time: Always time for time picker
        name:
          type: string
          maxLength: 255
          description: Name that will be sent to your application as the key for the user-specified value
          example: newsletter_time
        label:
          type: string
          maxLength: 150
          description: Field label
          example: Newsletter time
        initial_time:
          type: string
          format: time
          description: Initial field value in HH:mm format. A value in HH:mm:ss format is also accepted, with the seconds discarded
          example: '11:00'
        required:
          type: boolean
          description: Required
          example: false
          default: false
        hint:
          type: string
          maxLength: 2000
          description: Hint displayed below the field in gray
          example: Specify the time to send the selected newsletters
      description: Time block — time picker
    ViewBlockUnion:
      anyOf:
        - $ref: '#/components/schemas/ViewBlockHeader'
        - $ref: '#/components/schemas/ViewBlockPlainText'
        - $ref: '#/components/schemas/ViewBlockMarkdown'
        - $ref: '#/components/schemas/ViewBlockDivider'
        - $ref: '#/components/schemas/ViewBlockInput'
        - $ref: '#/components/schemas/ViewBlockSelect'
        - $ref: '#/components/schemas/ViewBlockRadio'
        - $ref: '#/components/schemas/ViewBlockCheckbox'
        - $ref: '#/components/schemas/ViewBlockDate'
        - $ref: '#/components/schemas/ViewBlockTime'
        - $ref: '#/components/schemas/ViewBlockFileInput'
      description: Union type for all possible view blocks
    ViewSubmitWebhookPayload:
      type: object
      required:
        - type
        - event
        - callback_id
        - private_metadata
        - chat_id
        - user_id
        - view_id
        - submit_id
        - data
        - webhook_timestamp
      properties:
        type:
          type: string
          enum:
            - view
          description: Object type
          example: view
          x-enum-descriptions:
            view: Always view for forms
        event:
          type: string
          enum:
            - submit
          description: Event type
          example: submit
          x-enum-descriptions:
            submit: Form submission
        callback_id:
          type: string
          nullable: true
          description: Callback ID specified when opening the view. `null` if it was not specified when the form was opened.
          example: timeoff_request_form
        private_metadata:
          type: string
          nullable: true
          description: Private metadata specified when opening the view. `null` if it was not specified when the form was opened.
          example: '{"timeoff_id":4378}'
        chat_id:
          type: integer
          format: int32
          nullable: true
          description: >-
            ID of the chat in which the button that opened the form was clicked. The value is captured at the moment the
            form was **opened**, not submitted — if the form stayed open for a long time, `chat_id` still points to the
            chat where the button was clicked. The field is always present in the payload; for forms opened before this
            change was rolled out, `chat_id` will be `null` — such forms will gradually phase out by the saved view TTL
            (30 days).
          example: 9012
        user_id:
          type: integer
          format: int32
          description: ID of the user who submitted the form
          example: 1235523
        view_id:
          type: string
          description: >-
            View ID. A bot with no outgoing webhook address needs it to respond with the [Respond to a form
            submission](POST /views/{view_id}/submit_response) method.
          example: 01KAJZ2XDSS2S3DSW9EXJZ0TBV
        submit_id:
          type: string
          description: >-
            Form submission ID. A bot with no outgoing webhook address needs it to respond with the [Respond to a form
            submission](POST /views/{view_id}/submit_response) method.
          example: 791a056b-006c-49dd-834b-c633fde52fe8
        data:
          type: object
          additionalProperties: {}
          description: >-
            Submitted view field data. Key — block `name`, value — entered data. For a `file_input` block the value
            arrives as an array of objects with `name`, `size` and `url`, and the link is valid for 2 hours.
        webhook_timestamp:
          type: integer
          format: int32
          description: Webhook send date and time (UTC+0) in UNIX format
          example: 1755075544
      description: Outgoing webhook payload for form submission
    VoiceContent:
      type: object
      required:
        - duration_ms
        - waveform
        - transcript
      properties:
        duration_ms:
          type: integer
          format: int32
          description: Voice message duration in milliseconds
          example: 5400
        waveform:
          type: string
          description: Waveform (amplitudes) for visualizing the voice message
          example: 4,8,12,20,16,10,6,3
        transcript:
          type: string
          nullable: true
          description: Voice message transcription to text. `null` while the transcription is not ready or unavailable.
          example: Hi, please take a look at the latest report
      description: Voice message data
    WebhookEvent:
      type: object
      required:
        - id
        - event_type
        - payload
        - created_at
      properties:
        id:
          type: string
          description: Event ID
          example: 01KAJZ2XDSS2S3DSW9EXJZ0TBV
        event_type:
          type: string
          description: Event type
          example: message_new
        payload:
          allOf:
            - $ref: '#/components/schemas/WebhookPayloadUnion'
          description: Webhook object
        created_at:
          type: string
          format: date-time
          description: Event creation date and time (ISO-8601, UTC+0) in YYYY-MM-DDThh:mm:ss.sssZ format
          example: '2025-05-15T14:30:00.000Z'
      description: Outgoing webhook event
    WebhookEventType:
      type: string
      enum:
        - new
        - update
        - delete
      description: Webhook event type
      x-enum-descriptions:
        new: Created
        update: Update
        delete: Deleted
    WebhookLink:
      type: object
      required:
        - url
        - domain
        - skip
      properties:
        url:
          type: string
          description: Link URL
          example: https://example.com/page1
        domain:
          type: string
          description: Link domain
          example: example.com
        skip:
          type: boolean
          description: Whether the message author hid the preview for this link. If `true`, the bot must not create a preview
          example: false
      description: Link object in the link unfurling webhook
    WebhookMessageThread:
      type: object
      required:
        - message_id
        - message_chat_id
      properties:
        message_id:
          type: integer
          format: int32
          nullable: true
          description: >-
            ID of the message the thread was created for. `null` for a thread without a parent message — such threads
            are created by [New standalone thread](POST /threads).
          example: 12345
        message_chat_id:
          type: integer
          format: int32
          nullable: true
          description: ID of the chat of the message the thread was created for. `null` for a thread without a parent message.
          example: 67890
      description: Thread object in the message webhook
    WebhookPayloadUnion:
      anyOf:
        - $ref: '#/components/schemas/MessageWebhookPayload'
        - $ref: '#/components/schemas/ReactionWebhookPayload'
        - $ref: '#/components/schemas/ButtonWebhookPayload'
        - $ref: '#/components/schemas/ViewSubmitWebhookPayload'
        - $ref: '#/components/schemas/ChatMemberWebhookPayload'
        - $ref: '#/components/schemas/CompanyMemberWebhookPayload'
        - $ref: '#/components/schemas/LinkSharedWebhookPayload'
        - $ref: '#/components/schemas/VideoCallWebhookPayload'
      description: Union of all webhook payload types
      x-union-deserializer: webhook-payload
    WebhookVideoCallMember:
      type: object
      required:
        - user_id
        - joined_at
        - left_at
      properties:
        user_id:
          type: integer
          format: int32
          description: Participant ID
          example: 2345
        joined_at:
          type: string
          format: date-time
          description: First join date and time (ISO-8601, UTC+0) in YYYY-MM-DDThh:mm:ss.sssZ format
          example: '2025-05-15T14:30:00.000Z'
        left_at:
          type: string
          format: date-time
          description: >-
            Leave date and time (ISO-8601, UTC+0) in YYYY-MM-DDThh:mm:ss.sssZ format. If the participant stayed until
            the call ended, it matches the call end time.
          example: '2025-05-15T14:45:00.000Z'
      description: Video call participant
    WebhookVideoCallThread:
      type: object
      required:
        - id
        - chat_id
        - message_id
        - message_chat_id
      properties:
        id:
          type: integer
          format: int32
          description: Thread ID
          example: 12345
        chat_id:
          type: integer
          format: int32
          description: Thread chat ID
          example: 67890
        message_id:
          type: integer
          format: int32
          nullable: true
          description: >-
            ID of the message the thread was created for. `null` for a thread without a parent message — such threads
            are created by [New standalone thread](POST /threads).
          example: 268092
        message_chat_id:
          type: integer
          format: int32
          nullable: true
          description: Chat ID of the message the thread was created for. `null` for a thread without a parent message.
          example: 23438
      description: Parameters of the thread the video call takes place in
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: https://api.pachca.com/api/shared/v1
    description: Production server
    variables: {}
