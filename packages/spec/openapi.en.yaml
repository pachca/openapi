          example: 791a056b-006c-49dd-834b-c633fde52fe8
        errors:
          type: object
          additionalProperties:
            type: string
          description: >-
            Field validation errors. Key — block `name`, value — the error text shown under the field. Without this
            field the view closes as successfully submitted.
          example:
