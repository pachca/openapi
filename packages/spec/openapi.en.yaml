    TaskCreateRequest:
      type: object
      required:
        - task
      properties:
        task:
          type: object
          properties:
            kind:
              allOf:
                - $ref: '#/components/schemas/TaskKind'
              description: Kind
              example: reminder
            content:
              type: string
              description: Description (defaults to the kind name)
              example: Pick up 21 orders from the warehouse
            due_at:
              type: string
              format: date-time
              description: >-
                Task due date (ISO-8601). An offset such as `+03:00` is taken into account, and a time without an offset
                is treated as UTC. Seconds are dropped: the due date lands on the start of the minute. The exception is
                exactly 23:59:59: such a task is created as an all-day one, without a specific time.
              example: '2020-06-05T12:00:00.000+03:00'
            priority:
              type: integer
              format: int32
              minimum: 1
              maximum: 3
              description: 'Priority: 1, 2 (important), or 3 (very important)'
              example: 2
              default: 1
            performer_ids:
              type: array
              items:
                type: integer
                format: int32
              description: Array of user IDs to assign as task performers (defaults to you)
              example:
                - 12
                - 13
            chat_id:
              type: integer
              format: int32
              description: ID of the chat to link the task to
              example: 456
            all_day:
              type: boolean
              description: Whether this is an all-day task (without specific time)
              example: false
            custom_properties:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    format: int32
                    description: Property ID
                    example: 78
                  value:
                    type: string
                    description: Value to set
                    example: Blue warehouse
                required:
                  - id
                  - value
              description: Custom properties to set
          required:
