  /messages:
    post:
      operationId: MessageOperations_createMessage
      description: >-
        New message


        Sends a message to a conversation or a channel, a direct message to an employee, or a comment to a thread.


        When using `entity_type: "discussion"` (or simply without specifying `entity_type`), any `chat_id` can be passed
        in the `entity_id` field. This means you can send a message knowing only the chat ID. A message can also be sent
        to a thread by the thread's own ID, and a direct message by the employee's ID, but then the matching
        `entity_type` must be given: `thread` or `user`.


        There is no need to create the direct chat for this: it appears by itself if there has been no prior
        conversation between you. Only one direct chat can exist between two employees. Your own ID writes to the chat
        with yourself — the same place where an employee sends notes to themselves.


        The text in the `content` field is parsed as markdown: bold, italic, strikethrough, inline code, code block, and
        links. Lists and tables are not parsed — `-`, `1.`, and `|` stay as they are, a quote loses its `>`, and a line
        with a hash and a space becomes bold. The details are in the [Text formatting](/guides/markdown) section.


        `@all` mentions all members of the chat, `@here` those who are currently online, and `@` with a tag name without
        spaces the employees of that tag. In a thread a mention also works as an invitation: a mentioned employee who is
        not in the thread is added to it by Pachca and gains access to the thread and its parent message. To prevent
        that, pass `skip_invite_mentions: true`. In a conversation or a channel a mention adds nobody, and the parameter
        changes nothing there.


        Buttons can be shown under the message text — the `buttons` array, where each nested array is a row. They only
        work on messages sent with a bot token: a click on a button with `data` arrives as a `button_click` event to
        that same bot, carrying a `trigger_id` — there are 3 seconds to open a form with it, the [Open view](POST
        /views/open) method. A button with `url` simply follows the link and creates no event. Details are in the
        [Buttons](/guides/buttons) section.


        A bot can sign a message with someone else's name and avatar: `display_name` and `display_avatar_url` change the
        sender for this message only. The **Bot** badge stays, and the sender's profile still shows the real bot. This
        is how the original author is shown when a conversation is carried over from another system. With a personal
        token these fields are not available and the response is `403`. Details are in the [Bots](/guides/bots/overview)
        section.


        No more than 10 files can be attached to a message. A link preview is built only if `link_preview` is passed at
        the root of the request body.


        A daily limit applies to the number of messages into one chat from one sender. When it is exceeded the method
        responds `429`, and the `Retry-After` header carries the pause before the next attempt. The limit values are in
        the [Limits](/api/limits) section.
