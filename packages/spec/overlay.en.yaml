  - target: $.paths['/files/{id}'].get
    update:
      description: |-
        Downloading a file

        Returns the file itself, not a link to it. It is needed for attachments that have no direct storage link: their `url` field holds the address of this method, and it can only be opened with a token. Encrypted files and files sent from the workspace secure perimeter are served this way — both settings are covered in [Encryption and the secure perimeter](/guides/data-protection).

        A refusal comes as `403` with the `confidential_download_denied` code. The address being checked is the one the request came from, that is the address of your server, not of the employee whose token you use: for a server integration that is the most common reason to be refused.

        The response is the body of the file and a `Content-Disposition` header with its name, not `JSON`. An encrypted file is decrypted on the fly and comes as a whole attachment: `target` does not apply to it. If it could not be decrypted, the answer is `400` with the `decryption_failed` code.

        An attachment of a message is available to whoever sees the message itself, and an attachment of a draft only to its author.
  - target: $.paths['/files/{id}'].get.parameters[?(@.name=='id')]
    update:
      description: File ID as it comes in the attachment object
  - target: $.paths['/files/{id}'].get.parameters[?(@.name=='target')]
    update:
      description: "What to return instead of the original file: `pdf_preview` — the document converted to PDF, `pdf_first_page` — the first page as an image, `thumb` — a scaled-down copy of the image, `image` — the image as it is. Without the parameter the original file comes. A variant this file does not have leads to `400`."
