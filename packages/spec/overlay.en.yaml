  - target: $.paths['/bots'].post
    update:
      description: |-
        New bot

        Creates a bot in the workspace and immediately returns its `access_token`. Save the token at creation: the same one is not shown again, and what remains is to reissue it with [Bot token rotation](POST /bots/{id}/recreate_token).

        A newly created bot does not write anywhere yet. It writes into a conversation and a channel only as a member, and it is added like an employee — with the [Add users](POST /chats/{id}/members) method, passing the bot's `id`. In a channel the bot receives the editor role. Direct messages and threads in public chats do not require membership.

        The bot's incoming webhook sends a message at once to every conversation and channel the bot belongs to, so it is the set of its chats that decides where it lands. No token is needed for that, the webhook address is enough. To write into one particular chat, take the [New message](POST /messages) method — that one does need a token.

        The nickname must end with `_bot` and be free in the workspace. The `single_chat` restriction is set only here: when editing a bot it can no longer be changed.
  - target: $.paths['/bots/{id}'].get
    update:
      description: |-
        Bot info

        The bot's settings. The token does not come in the response — it is shown once at the bot's creation and at [Bot token rotation](POST /bots/{id}/recreate_token).

        The method returns only the bots the caller is entitled to configure: their own, and, if the bot's settings allow it, also as a workspace administrator or as the owner of a chat the bot belongs to. For someone else's bot the method responds `403`.

        The list of all bots in the workspace, including other people's, is available to the owner on the "Corporation" plan — [List workspace bots](GET /company/bots).
