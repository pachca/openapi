        unhandled: Request execution error (details provided in the message field)
        trigger_not_found: Event identifier not found
        trigger_expired: Event identifier has expired
        required: Required parameter not provided
        in: Invalid value (not in the list of allowed values)
        not_applicable: Value not applicable in this context (details provided in the message field)
        self_update: Cannot modify your own data
        owner_protected: Cannot modify owner data
        already_assigned: Value already assigned
        forbidden: Insufficient permissions to perform the action (details provided in the message field)
        permission_denied: Access denied (insufficient permissions)
        access_denied: Access denied
        wrong_params: Invalid request parameters (details provided in the message field)
        payment_required: Payment required
        min_length: Value is too short (details provided in the message field)
        max_length: Value is too long (details provided in the message field)
        use_of_system_words: Reserved system word used (here, all)
        export_file_not_found: Export file not found or not ready yet
        cannot_kick_owner: Cannot remove the chat owner
        pin_failed: Failed to pin the message
        message_deleted: Message has been deleted
        thread_message: Cannot create a thread for a message that is already in a thread
        view_not_found: View not found or belongs to a different bot
        submit_expired: The response window for the form submission has expired, or a response was already accepted
        service_unavailable: Service temporarily unavailable, retry the request
        next_send_at_invalid: The next sending of the scheduled message falls in the past
        schedule_invalid: The schedule of the scheduled message does not add up to a repetition
        schedule_end_date_invalid: The schedule ends earlier than the next sending
        scheduled_messages_limit: Scheduled message limit per chat exceeded (50)
        draft_type_change_forbidden: A scheduled message cannot be turned back into a draft
