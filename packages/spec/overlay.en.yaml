    update:
      description: Bot webhook self-registration request
  - target: $.components.schemas.BotWebhookSelfUpdateRequest.properties.webhook
    update:
      description: Webhook parameters object
  - target: $.components.schemas.BotWebhookSelfUpdateRequest.properties.webhook.properties.outgoing_url
    update:
      description: Outgoing webhook URL. An empty string disables the webhook.
  - target: $.paths['/bot/webhook'].put
    update:
      description: >-
        Bot webhook self-registration


        Allows a bot to change its own outgoing webhook `URL` using its own token — without an administrator and without
        knowing its own `id`. The webhook of the bot that owns the token is changed. To disable the webhook, send an empty string in `outgoing_url`.

  - target: $.paths['/bots/{id}/recreate_token'].post
    update:
      description: |-
        Bot token rotation

        Generates a new `access_token` for the bot and immediately invalidates the previous one. Use it when a token is compromised or for scheduled secret rotation in `CI`.

        The new token is returned in the response only once — save it right away. Its permissions are the same: the scopes are carried over from the previous token.

        Rotation is available to the bot creator, and also to a workspace administrator if the bot's settings grant administrators edit access. The owner of a chat the bot belongs to cannot rotate the token, even when the rest of the bot's settings are open to them.
  - target: $.paths['/bots/{id}/recreate_token'].post.parameters[?(@.name=='id')]
    update:
      description: Bot ID
  - target: $.paths['/bot/recreate_token'].post
    update:
      description: |-
        Bot self token rotation

        Allows a bot to generate a new `access_token` for itself using its own token — without an administrator and without knowing its own `id`.

        The very token the request was made with is rotated, and it is invalidated immediately.

        The new token is returned in the response once — be sure to save it, otherwise the bot loses access to the API. The scopes are carried over from the previous token.
