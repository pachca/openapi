overlay: 1.0.0
info:
  title: Pachca API — English translations
  version: 1.0.0
actions:
  - target: $.paths['/audit_events'].get
    update:
      description: |-
        Audit event log

        What has been happening in the workspace: sign-ins and sign-outs, changes of roles and settings, actions on chats, employees, and bots. The records are read-only — they cannot be changed or deleted either through the API or from the interface.

        The method is available to the workspace owner on the "Corporation" plan; other employees receive `403`. Accessing the audit log is itself written to the audit log — as the `audit_events_accessed` event.

        Events come from newest to oldest and are selected with filters: the period by `start_time` and `end_time`, the kind of event by `event_key`, and the actor by `actor_id` and `actor_type`. Without filters the method returns all events of the workspace page by page.
  - target: $.paths['/audit_events'].get.parameters[?(@.name=='start_time')]
    update:
      description: "Start timestamp, inclusive (ISO-8601). An offset such as `+03:00` is taken into account, and a time without an offset is treated as UTC. A value that could not be parsed removes the filter — the response comes in full, without an error."
  - target: $.paths['/audit_events'].get.parameters[?(@.name=='end_time')]
    update:
      description: "End timestamp, inclusive (ISO-8601). An offset such as `+03:00` is taken into account, and a time without an offset is treated as UTC. A value that could not be parsed removes the filter — the response comes in full, without an error."
  - target: $.paths['/audit_events'].get.parameters[?(@.name=='event_key')]
    update:
      description: Filter by specific event type
  - target: $.paths['/audit_events'].get.parameters[?(@.name=='actor_id')]
    update:
      description: ID of the user who performed the action
  - target: $.paths['/audit_events'].get.parameters[?(@.name=='actor_type')]
    update:
      description: Actor type
  - target: $.paths['/audit_events'].get.parameters[?(@.name=='entity_id')]
    update:
      description: ID of the affected entity
  - target: $.paths['/audit_events'].get.parameters[?(@.name=='entity_type')]
    update:
      description: Entity type
  - target: $.paths['/audit_events'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of records to return
  - target: $.paths['/audit_events'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page` or `meta.paginate.prev_page`)
  - target: $.paths['/bots/{id}'].put
    update:
      description: |-
        Edit bot

        Changes a bot's settings: only the fields you pass are overwritten.

        The `single_chat` field is accepted only when a bot is created. In this method it is silently ignored: the response is successful and the bot's mode does not change.

        The nickname must end with `_bot` and be free in the workspace, otherwise the method responds with a validation error. Commands and scopes are replaced by the passed list as a whole, and the new set of scopes is applied to the bot's current token right away — there is no need to reissue it.

        You cannot edit a bot whose settings are not accessible to you (the "Who can edit bot settings" field is located on the "General" tab in the bot settings).
  - target: $.paths['/bots/{id}'].put.parameters[?(@.name=='id')]
    update:
      description: Bot ID
  - target: $.paths['/bots'].get
    update:
      description: |-
        List bots

        The bots the caller is entitled to configure: those they created themselves and those whose settings grant them edit access.

        The `query` parameter selects bots by part of the name, without typos. Bot tokens do not come in the list — they are shown once at creation and at rotation.

        The list of all bots in the workspace, including other people's, is available to the owner on the "Corporation" plan — [List workspace bots](GET /company/bots). There other people's bots come with only a name and a nickname, and the rest of the settings are hidden.
  - target: $.paths['/bots'].get.parameters[?(@.name=='query')]
    update:
      description: Search phrase to filter bots by name
  - target: $.paths['/bots'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of entities returned per request
  - target: $.paths['/bots'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page`)
  - target: $.paths['/company/bots'].get
    update:
      description: >-
        List workspace bots


        Every bot in the workspace, including the ones you cannot edit. For those, only the name and the nickname are
        returned, the rest of the settings come as `null`.


        The method is available to the workspace owner. Every request is written to the [audit
        log](/guides/audit-events) with the `company_bots_accessed` key.
  - target: $.paths['/company/bots'].get.parameters[?(@.name=='query')]
    update:
      description: Search phrase to filter bots by name
  - target: $.paths['/company/bots'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of entities returned per request
  - target: $.paths['/company/bots'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page`)
  - target: $.paths['/bots/{id}'].delete
    update:
      description: >-
        Delete bot


        Delete a bot. The bot's previous `access_token` is invalidated immediately, the bot is removed from all chats,
        and its outgoing webhook is deleted.


        Deletion is available to the bot creator, and to a workspace administrator if the bot's settings grant
        administrators edit access. Chat owners and admins cannot delete a bot, even if they are allowed to edit it.
  - target: $.paths['/bots/{id}'].delete.parameters[?(@.name=='id')]
    update:
      description: Bot ID
  - target: $.paths['/chats'].post
    update:
      description: |-
        New chat

        Creates a conversation or a channel. The token owner becomes the chat owner, and this role is not transferred later on.

        A multi-guest cannot create chats, as in the interface: the method responds `403` to them.

        To create a one-on-one direct message with a user, use the [New message](POST /messages) method. To discuss a particular message there is no need to create a chat — a thread is started under it with the [New thread](POST /messages/{id}/thread) method.

        Members can be passed right away: `member_ids` adds them one by one, `group_tag_ids` brings in everyone who belongs to the tag and keeps the membership up to date afterwards. IDs that do not exist in the workspace, as well as suspended and deleted employees, are silently dropped — the response is successful but the employee is not in the chat, so check the membership in the response. Bots are stricter: if a bot's "Who can add the bot to chats" setting does not let you add it, the chat is not created, and the method responds `403` with the `bot_add_denied` code and the IDs of such bots in `value`.
  - target: $.paths['/chats'].get
    update:
      description: |-
        List chats

        By default — the conversations, channels, and direct messages the token owner belongs to. With `availability=public` the method returns instead all public chats of the workspace, including the ones the caller has not joined. For a multi-guest — only the public chats they are a member of.

        Threads never come in this list; for them there is [List threads](GET /threads).

        `archived=true` does not switch the results to the archive, it adds archived chats to the active ones.
  - target: $.paths['/chats'].get.parameters[?(@.name=='sort')]
    update:
      description: Sort field
  - target: $.paths['/chats'].get.parameters[?(@.name=='order')]
    update:
      description: Sort direction
  - target: $.paths['/chats'].get.parameters[?(@.name=='availability')]
    update:
      description: Parameter that controls chat availability and filtering for the user
  - target: $.paths['/chats'].get.parameters[?(@.name=='archived')]
    update:
      description: >-
        Include archived chats in the response. By default only active chats are returned. Works with any
        `availability` value.
  - target: $.paths['/chats'].get.parameters[?(@.name=='last_message_at_after')]
    update:
      description: "Filter by the creation time of the last message: chats where it is later than the specified one are returned. The value is in ISO-8601, an offset such as `+03:00` is taken into account, and a time without an offset is treated as UTC."
  - target: $.paths['/chats'].get.parameters[?(@.name=='last_message_at_before')]
    update:
      description: "Filter by the creation time of the last message: chats where it is earlier than the specified one are returned. The value is in ISO-8601, an offset such as `+03:00` is taken into account, and a time without an offset is treated as UTC."
  - target: $.paths['/chats'].get.parameters[?(@.name=='personal')]
    update:
      description: Filter by direct and group chats. If not specified, all chats are returned.
  - target: $.paths['/chats'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of records to return per request
  - target: $.paths['/chats'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page` or `meta.paginate.prev_page`)
  - target: $.paths['/company/chats'].get
    update:
      description: >-
        List workspace chats


        The conversations and channels of the whole workspace, including private ones you are not a member of. Direct
        messages and threads are not returned.


        Both active and archived chats are returned by default. The `activity` parameter keeps only one of the states in
        the selection.


        The method is available to the workspace owner. Every request is written to the [audit
        log](/guides/audit-events) with the `company_chats_accessed` key.
  - target: $.paths['/company/chats'].get.parameters[?(@.name=='activity')]
    update:
      description: Chat state. If the parameter is omitted, both active and archived chats are returned.
  - target: $.paths['/company/chats'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of entities returned per request
  - target: $.paths['/company/chats'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page`)
  - target: $.paths['/chats/exports'].post
    update:
      description: |-
        Export messages

        Order an export of the workspace messages for a period. The archive is prepared in the background, so the response comes back empty and contains no export identifier.

        The number of the finished export arrives in the `export_id` field of the webhook sent to the address from `webhook_url`. The employee who ordered it also receives an email and a notification in Pachca with a link of the form `/full_exports/{id}` — the number in it is the identifier. The webhook address is optional, but without it a program has nowhere to take the number from: only the email and the notification to whoever ordered it are left.

        With that identifier the archive is fetched by the [Download export archive](GET /chats/exports/{id}) method.
  - target: $.paths['/chats/exports/{id}'].get
    update:
      description: |-
        Download export archive

        In response to the request the server returns `302 Found` with a `Location` header containing a temporary download link for the file. Most HTTP clients automatically follow the redirect and download the file.

        The link is valid for 5 minutes, so download the archive right after the request. The archive itself is stored for 7 days, and only the employee who ordered the export can download it — the method refuses another employee holding the same permission.
  - target: $.paths['/chats/exports/{id}'].get.parameters[?(@.name=='id')]
    update:
      description: Export ID
  - target: $.paths['/chats/exports/{id}'].get.responses['302'].headers.location
    update:
      description: Temporary link to the archive in storage, valid for 5 minutes
  - target: $.paths['/chats/{id}'].get
    update:
      description: |-
        Chat info

        The chat's details together with the list of members and the linked tags.

        A private conversation the caller does not belong to responds `403`, not `404`: this method does not hide the existence of a chat. A public channel of your own workspace is returned even to someone who has not joined it. The method does not open other people's private chats to the workspace owner either — the full list of those is returned by [List workspace chats](GET /company/chats).

        Only active members come in `member_ids`: suspended ones do not make it into the list, although their membership is kept.
  - target: $.paths['/chats/{id}'].get.parameters[?(@.name=='id')]
    update:
      description: Chat ID
  - target: $.paths['/chats/{id}'].put
    update:
      description: |-
        Edit chat

        Changes the name of a conversation or a channel and its availability. Both changes are visible to the members as a system message in the chat feed.

        A direct chat cannot be renamed, and neither can an archived one: [Unarchive chat](PUT /chats/{id}/unarchive) it first. In a private chat the method is available to the chat owner and a chat administrator, in a public one to any employee of the workspace, even a non-member.

        The membership is not changed by this method; for that there are [Add users](POST /chats/{id}/members) and [Remove user](DELETE /chats/{id}/members/{user_id}).
  - target: $.paths['/chats/{id}'].put.parameters[?(@.name=='id')]
    update:
      description: Chat ID
  - target: $.paths['/chats/{id}/archive'].put
    update:
      description: |-
        Archive chat

        Sends a conversation or a channel to the archive: the chat disappears from the lists of all members, new messages are not accepted into it, and the history is kept.

        Archiving does not merely freeze the chat. All guests are removed from it and all tags are unlinked from it. The employees a tag brought in stay as ordinary members, but the membership is no longer maintained by itself. The [Unarchive chat](PUT /chats/{id}/unarchive) method brings back neither the guests nor the tag links.

        Threads created in the chat stay open: they can still be written to after archiving.

        A direct chat and a thread are not sent to the archive. Archiving a chat that is already archived responds `403`.
  - target: $.paths['/chats/{id}/archive'].put.parameters[?(@.name=='id')]
    update:
      description: Chat ID
  - target: $.paths['/chats/{id}/group_tags'].post
    update:
      description: |-
        Add tags

        Links tags to a conversation or a channel so that the chat membership keeps itself up to date.

        After adding a tag, all its members automatically become members of the chat. The tag and chat member lists are synchronized automatically: when a new member is added to the tag, they immediately appear in the chat; when removed from the tag, they are removed from the chat.

        If at least one of the tags passed is not found, the method responds `404` and links none of them. A tag already linked to the chat is not linked again, but its members are still pulled into the chat.

        A tag can be linked by a member of a private conversation and by any employee of the workspace in an open chat, while taking it off is available only to the chat owner or a chat administrator through the [Remove tag](DELETE /chats/{id}/group_tags/{tag_id}) method.
  - target: $.paths['/chats/{id}/group_tags'].post.parameters[?(@.name=='id')]
    update:
      description: Chat ID
  - target: $.paths['/chats/{id}/group_tags/{tag_id}'].delete
    update:
      description: |-
        Remove tag

        Unlinks a tag from a conversation or a channel and takes out the employees who were held there by it alone.

        The removal happens in the background, after the response: the method responds `204` immediately, and the chat membership changes a few moments later. The chat owner, those brought in by another tag of the same chat, and those added to the chat by hand will stay.

        A tag can be taken off a chat by the chat owner or a chat administrator. It can be linked back with the [Add tags](POST /chats/{id}/group_tags) method.
  - target: $.paths['/chats/{id}/group_tags/{tag_id}'].delete.parameters[?(@.name=='id')]
    update:
      description: Chat ID
  - target: $.paths['/chats/{id}/group_tags/{tag_id}'].delete.parameters[?(@.name=='tag_id')]
    update:
      description: Tag ID
  - target: $.paths['/chats/{id}/leave'].delete
    update:
      description: |-
        Leave chat

        The token owner leaves a conversation, a channel, or a thread on their own. A thread is addressed by its `chat_id`. In a private conversation the others see a system message about the departure; in a public chat and in a channel they do not.

        You cannot leave if an employee is held in the chat by a linked tag: the method responds `403` until the tag is taken off the employee or off the chat. You cannot leave a direct message either, but you can leave an archived chat.

        You can come back to a public chat on your own, and to a private one only if one of the members adds you back. Another employee is taken out by [Remove user](DELETE /chats/{id}/members/{user_id}).
  - target: $.paths['/chats/{id}/leave'].delete.parameters[?(@.name=='id')]
    update:
      description: Chat ID
  - target: $.paths['/chats/{id}/members'].get
    update:
      description: |-
        List chat members

        Who belongs to a conversation, a channel, or a thread. Bots come on equal terms with employees, with `bot: true`.

        The workspace owner can retrieve the member list of any chat in the workspace. Admins and bots can only retrieve the member list of chats they belong to (or that are public).

        Only active employees make it into the results: suspended ones do not come, although their membership is kept. The method does not return a member's role in the chat — the `role` parameter works only as a filter.
  - target: $.paths['/chats/{id}/members'].get.parameters[?(@.name=='id')]
    update:
      description: Chat ID
  - target: $.paths['/chats/{id}/members'].get.parameters[?(@.name=='role')]
    update:
      description: Role in the chat
  - target: $.paths['/chats/{id}/members'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of records to return per request
  - target: $.paths['/chats/{id}/members'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page` or `meta.paginate.prev_page`)
  - target: $.paths['/chats/{id}/members'].post
    update:
      description: |-
        Add users

        Adds employees and bots to a conversation, a channel, or a thread. A bot is added the same way as an employee: its `id` in `member_ids`. In a channel it receives the editor role, and in a conversation it becomes an ordinary member — and only after that can it write there.

        The role in the chat is assigned at the moment of adding: the workspace owner and an administrator become chat administrators, everyone else becomes an ordinary member. After that it is not recalculated by itself, and promoting an employee in the workspace changes nothing where they already belong. To change a role, use the [Edit role](PUT /chats/{id}/members/{user_id}) method.

        Those who already belong to the chat are silently skipped by the method, and this is not treated as an error. An unknown or inactive ID, however, stops the whole request: the method responds `404` and lists such values, and nobody is added.

        A bot is added only by someone its "Who can add the bot to chats" setting allows — see [Bot settings](/guides/bots/settings#kto-mozhet-dobavlyat-bota-v-chaty). If `member_ids` contains a bot you are not allowed to add, the method adds nobody and responds `403` with the `bot_add_denied` code and the IDs of such bots in `value`. If the same request also has an unknown ID, the response is `404` with both errors.

        Adding a whole department at once is more convenient with a tag — [Add tags](POST /chats/{id}/group_tags): then the chat membership is maintained by itself.
  - target: $.paths['/chats/{id}/members'].post.parameters[?(@.name=='id')]
    update:
      description: Chat ID (conversation, channel, or thread chat)
  - target: $.paths['/chats/{id}/members/{user_id}'].delete
    update:
      description: |-
        Remove user

        Removes an employee or a bot from a conversation, a channel, or a thread. A thread is addressed by its `chat_id`. In a private conversation the removed member loses access to the chat but stays in the threads they belonged to.

        An employee held in the chat by a linked tag cannot be removed with this method: the response will be successful, but the employee will stay in the chat. Take the tag off them with [Edit employee](PUT /users/{id}) or unlink the tag from the chat with the [Remove tag](DELETE /chats/{id}/group_tags/{tag_id}) method.

        If the user is the chat owner, they cannot be removed. They can only leave the chat on their own using the [Leave chat](DELETE /chats/{id}/leave) method.
  - target: $.paths['/chats/{id}/members/{user_id}'].delete.parameters[?(@.name=='id')]
    update:
      description: Chat ID
  - target: $.paths['/chats/{id}/members/{user_id}'].delete.parameters[?(@.name=='user_id')]
    update:
      description: User ID
  - target: $.paths['/chats/{id}/members/{user_id}'].put
    update:
      description: |-
        Edit role

        Changes the role of a member of a conversation or a channel. A role in a chat is not tied to a role in the workspace: a regular employee can be a chat administrator, and a promotion in the workspace does not change roles in chats.

        The `editor` role exists only in channels. You cannot change your own role, nor the role of someone who is not in the chat: the method responds with an error. Setting the same role again is treated as an error, not as a repeat.

        The chat owner's role cannot be changed. They always have Admin privileges in the chat.
  - target: $.paths['/chats/{id}/members/{user_id}'].put.parameters[?(@.name=='id')]
    update:
      description: Chat ID
  - target: $.paths['/chats/{id}/members/{user_id}'].put.parameters[?(@.name=='user_id')]
    update:
      description: User ID
  - target: $.paths['/chats/{id}/unarchive'].put
    update:
      description: |-
        Unarchive chat

        Brings a conversation or a channel back from the archive: the chat appears in the lists again, and it becomes possible to write into it again.

        On a chat that is not in the archive anyway the method responds with success.
  - target: $.paths['/chats/{id}/unarchive'].put.parameters[?(@.name=='id')]
    update:
      description: Chat ID
  - target: $.paths['/custom_properties'].get
    update:
      description: |-
        List custom properties

        The schema of the workspace's custom properties: the ID, the name, and the type of each. Only employees and tasks have such properties, their sets are independent, and the `entity_type` parameter picks the one you need. The values come with the entity itself — in the employee's profile or in the task. The IDs from here are needed in order to set those values.

        Properties of the "File" and "Multiple choice" types are not available through the API and do not make it into the results. The basic profile fields — name, phone, email, department, tags — do not either: these are not custom properties.

        The set of properties is defined by the workspace administrator, who also renames and deletes them. That is why the list is worth re-reading before work: addressing a property that no longer exists returns an error.
  - target: $.paths['/custom_properties'].get.parameters[?(@.name=='entity_type')]
    update:
      description: Entity type
  - target: $.paths['/direct_url'].post
    update:
      description: |-
        Upload file

        The second step of the upload: the file itself goes to the storage as a `multipart/form-data` form. The form fields and the address are taken from the response of the [Get signature, key and other parameters](POST /uploads) method and passed as they are, in the same order, with the file as the last field.

        The request goes not to the Pachca API but straight to the storage, and `204` with no body comes back in response. After that the file is attached by passing its `key` in the `files` field — to [New message](POST /messages) or [New draft](POST /drafts), and when editing either of them. The file name in `name` must have the same extension as the `key`, otherwise the message will be rejected.
  - target: $.paths['/drafts'].post
    update:
      description: |-
        New draft

        Puts a draft into a conversation, a thread, or a direct message. In the Pachca interface it shows up in that chat's input box, where an employee finishes it and sends it. A scheduled message is created by this same method: with the `schedule` field the draft goes out by itself at the appointed time, without it the draft simply lies there. The method itself sends nothing — sending is [New message](POST /messages).

        A draft is visible only to its author — neither the other party nor a workspace administrator sees it. A chat can hold only one ordinary draft. A repeated call responds `409` with the `already_exists` code and the ID of the existing one in `payload.draft_id`. That one is finished with the [Edit draft](PUT /drafts/{id}) method. A chat holds no more than 50 scheduled messages.

        For a thread, `entity_id` takes the ID of the thread itself, not of the message it hangs under. A direct message with an employee may not exist yet — then it is created by itself, the same way as when an ordinary message is sent.

        An empty draft cannot be created: either text or attachments are needed.

        The method is not available to bot tokens.
  - target: $.paths['/drafts'].get
    update:
      description: |-
        List drafts

        Your own drafts, newest first.

        By default only ordinary drafts are returned: scheduled ones have to be asked for with the `type` parameter. In the response they are told apart by the `schedule` field.

        The pair `entity_type` and `entity_id` narrows the results down to a single chat, thread, or direct message. If there is no such chat or it is not accessible, the method responds with an empty list rather than an error.
  - target: $.paths['/drafts'].get.parameters[?(@.name=='type')]
    update:
      description: "What to return: `regular` — ordinary drafts, `scheduled` — scheduled messages, `all` — both"
  - target: $.paths['/drafts'].get.parameters[?(@.name=='entity_type')]
    update:
      description: "Chat type for filtering by a single chat. Specified together with `entity_id`: sending only one of the two returns `422`."
  - target: $.paths['/drafts'].get.parameters[?(@.name=='entity_id')]
    update:
      description: "ID of what is named in `entity_type`. Specified together with it."
  - target: $.paths['/drafts'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of entities returned per request
  - target: $.paths['/drafts'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page` or `meta.paginate.prev_page`)
  - target: $.paths['/drafts/{id}'].get
    update:
      description: |-
        Draft info

        The draft. For a scheduled message its schedule comes here too.
  - target: $.paths['/drafts/{id}'].get.parameters[?(@.name=='id')]
    update:
      description: Draft ID
  - target: $.paths['/drafts/{id}'].put
    update:
      description: |-
        Edit draft

        Changes your own draft: the text, the attachments, the schedule, and the message it will reply to (`parent_message_id`). Only the fields you pass are overwritten, so the text can be finished with `content` alone, without touching the attachments.

        An ordinary draft turns into a scheduled message if `schedule` is passed. The reverse transition is forbidden: `schedule: null` on a scheduled message responds `422` with the `draft_type_change_forbidden` code. To cancel the sending, the draft is removed with the [Delete draft](DELETE /drafts/{id}) method.

        Editing works only while writing into the chat is allowed. If access to the chat has been lost, editing responds `403`, while deletion works all the same.

        The draft's chat is not changed by this method, it does not accept `entity_type` and `entity_id`. To move a draft to another chat, create a new one and delete the old one.
  - target: $.paths['/drafts/{id}'].put.parameters[?(@.name=='id')]
    update:
      description: Draft ID
  - target: $.paths['/drafts/{id}'].delete
    update:
      description: |-
        Delete draft

        Removes your own draft for good: it cannot be restored, and the attachments are deleted along with it. For a scheduled message deleting is the cancellation of the sending.

        It works even if writing into the chat is no longer possible. A repeated call responds `404`.
  - target: $.paths['/drafts/{id}'].delete.parameters[?(@.name=='id')]
    update:
      description: Draft ID
  - target: $.paths['/group_tags'].post
    update:
      description: |-
        New tag

        Creates a tag. A tag is a way to keep chat membership up to date by itself: it is linked to a conversation or a channel, and everyone who has this tag ends up there automatically.

        Employees are added to a tag not here but in each employee's profile — [Edit employee](PUT /users/{id}) with the `list_tags` field. A fresh tag is created empty, with `users_count: 0`. It is linked to a chat by [Add tags](POST /chats/{id}/group_tags).

        The name is unique within the workspace, case-insensitively, and cannot contain `@`. Tags can be created by the workspace owner and an administrator; the method is not available to a bot.
  - target: $.paths['/group_tags'].get
    update:
      description: |-
        List tags

        All tags of the workspace with the number of employees in each, regardless of which chats they are linked to. A multi-guest gets only the tags of active conversations and channels they are a member of.

        The `names` parameter looks tags up by name — this is the way to get an `id` from a name known from the interface. It accepts no more than 100 names per request.

        Who belongs to a particular tag is returned by [List tag employees](GET /group_tags/{id}/users).
  - target: $.paths['/group_tags'].get.parameters[?(@.name=='names')]
    update:
      description: Array of tag names to filter by
  - target: $.paths['/group_tags'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of records to return per request
  - target: $.paths['/group_tags'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page` or `meta.paginate.prev_page`)
  - target: $.paths['/group_tags/{id}'].get
    update:
      description: |-
        Tag info

        The tag name and the number of employees in it.

        Only active employees are counted in `users_count`: suspended ones do not make it into the counter, although they remain in [List tag employees](GET /group_tags/{id}/users).

        Only the tags that come to a multi-guest in [List tags](GET /group_tags) are available to them; for the rest the method responds `404`.
  - target: $.paths['/group_tags/{id}'].get.parameters[?(@.name=='id')]
    update:
      description: Tag ID
  - target: $.paths['/group_tags/{id}'].put
    update:
      description: |-
        Edit tag

        Renames a tag. The set of employees and the links to chats do not change: everyone who was in the tag stays in it, only under the new name.

        The name is unique within the workspace, case-insensitively, and cannot contain `@`. Tags can be renamed by the workspace owner and an administrator; the method is not available to a bot.
  - target: $.paths['/group_tags/{id}'].put.parameters[?(@.name=='id')]
    update:
      description: Tag ID
  - target: $.paths['/group_tags/{id}'].delete
    update:
      description: |-
        Delete tag

        Removes a tag from the workspace: it is taken off every employee and unlinked from every chat.

        Nobody leaves the chats because of this. The employees the tag brought into a conversation or a channel stay there as ordinary members, and their membership is no longer maintained by the tag. To take them out of a particular chat, use [Remove tag](DELETE /chats/{id}/group_tags/{tag_id}) before deleting the tag itself.

        Tags can be deleted by the workspace owner and an administrator; the method is not available to a bot.
  - target: $.paths['/group_tags/{id}'].delete.parameters[?(@.name=='id')]
    update:
      description: Tag ID
  - target: $.paths['/group_tags/{id}/users'].get
    update:
      description: |-
        List tag employees

        Who belongs to the tag. Suspended employees come in the list, although they are not counted in the tag's own `users_count`; deleted ones do not come. Bots marked with the tag also make it into the results.

        The membership of a tag is changed in an employee's profile — [Edit employee](PUT /users/{id}) with the `list_tags` field, one employee at a time.

        For a multi-guest the method responds `403`: the list of workspace employees is closed to them, as in the interface.
  - target: $.paths['/group_tags/{id}/users'].get.parameters[?(@.name=='id')]
    update:
      description: Tag ID
  - target: $.paths['/group_tags/{id}/users'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of records to return per request
  - target: $.paths['/group_tags/{id}/users'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page` or `meta.paginate.prev_page`)
  - target: $.paths['/messages'].post
    update:
      description: |-
        New message

        Sends a message to a conversation or a channel, a direct message to an employee, or a comment to a thread.

        When using `entity_type: "discussion"` (or simply without specifying `entity_type`), any `chat_id` can be passed in the `entity_id` field. This means you can send a message knowing only the chat ID. A message can also be sent to a thread by the thread's own ID, and a direct message by the employee's ID, but then the matching `entity_type` must be given: `thread` or `user`.

        There is no need to create the direct chat for this: it appears by itself if there has been no prior conversation between you. Only one direct chat can exist between two employees. Your own ID writes to the chat with yourself — the same place where an employee sends notes to themselves.

        The text in the `content` field is parsed as markdown: bold, italic, strikethrough, inline code, code block, and links. Lists and tables are not parsed — `-`, `1.`, and `|` stay as they are, a quote loses its `>`, and a line with a hash and a space becomes bold. The details are in the [Text formatting](/guides/markdown) section.

        `@all` mentions all members of the chat, `@here` those who are currently online, and `@` with a tag name without spaces the employees of that tag. In a thread a mention also works as an invitation: a mentioned employee who is not in the thread is added to it by Pachca and gains access to the thread and its parent message. To prevent that, pass `skip_invite_mentions: true`. In a conversation or a channel a mention adds nobody, and the parameter changes nothing there.

        Buttons can be shown under the message text — the `buttons` array, where each nested array is a row. They only work on messages sent with a bot token: a click on a button with `data` arrives as a `button_click` event to that same bot, carrying a `trigger_id` — there are 3 seconds to open a form with it, the [Open view](POST /views/open) method. A button with `url` simply follows the link and creates no event. Details are in the [Buttons](/guides/buttons) section.

        A bot can sign a message with someone else's name and avatar: `display_name` and `display_avatar_url` change the sender for this message only. The **Bot** badge stays, and the sender's profile still shows the real bot. This is how the original author is shown when a conversation is carried over from another system. With a personal token these fields are not available and the response is `403`. Details are in the [Bots](/guides/bots/overview) section.

        No more than 10 files can be attached to a message. A link preview is built only if `link_preview` is passed at the root of the request body.

        A daily limit applies to the number of messages into one chat from one sender. When it is exceeded the method responds `429`, and the `Retry-After` header carries the pause before the next attempt. The limit values are in the [Limits](/api/limits) section.
  - target: $.paths['/messages'].get
    update:
      description: |-
        List chat messages

        The message feed of a conversation, a channel, a thread, or a direct message — by the `chat_id` of the chat in question.

        Messages come newest first, that is, the most recent messages of the chat come first. For earlier ones, use the `limit` and `cursor` parameters.

        Deleted messages do not make it into the list.

        The messages of a thread are returned by the `chat_id` of the thread itself, not by the chat where the parent message hangs. The thread identifier arrives in the `thread` field of the parent message.
  - target: $.paths['/messages'].get.parameters[?(@.name=='chat_id')]
    update:
      description: Chat ID (conversation, channel, direct message, or thread chat)
  - target: $.paths['/messages'].get.parameters[?(@.name=='sort')]
    update:
      description: Sort field
  - target: $.paths['/messages'].get.parameters[?(@.name=='order')]
    update:
      description: Sort direction
  - target: $.paths['/messages'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of records to return per request
  - target: $.paths['/messages'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page` or `meta.paginate.prev_page`)
  - target: $.paths['/messages/{id}'].get
    update:
      description: |-
        Message info

        The message together with its author, attachments, and buttons.

        A deleted message is returned by the method all the same — with empty `content` and a filled-in `deleted_at`, without files and reactions.

        The file links in the response are temporary. An ordinary file is returned as a direct link to the storage, while a protected or an encrypted one comes as an API address that requires a token with the `files:read` scope.
  - target: $.paths['/messages/{id}'].get.parameters[?(@.name=='id')]
    update:
      description: Message ID
  - target: $.paths['/messages/{id}'].put
    update:
      description: |-
        Edit message

        Changes the text, files, and buttons of a message that has already been sent. In the interface it gets an edited mark.

        You can edit only your own messages, and only ordinary ones: a system, a forwarded, and a voice message are not changed by the method. There are no restrictions on how long ago the message was sent.

        Files and buttons are replaced as a whole: an empty array removes all of them, while the absence of the field in the body leaves them as they were. Any edit removes the link previews, and they are not built again.
  - target: $.paths['/messages/{id}'].put.parameters[?(@.name=='id')]
    update:
      description: Message ID
  - target: $.paths['/messages/{id}'].delete
    update:
      description: |-
        Delete message

        Message deletion is available to the sender, admins, and editors in the chat. In direct messages, both users are editors. There are no time restrictions on message deletion.

        The text, files, and reactions disappear for everyone and are not restored, the pin is removed, and a "Message deleted" note stays in place of the message in the conversation.

        The thread created under this message stays, together with the whole conversation inside it. A repeated deletion responds `204` and no longer changes anything.
  - target: $.paths['/messages/{id}'].delete.parameters[?(@.name=='id')]
    update:
      description: Message ID
  - target: $.paths['/messages/{id}/link_previews'].post
    update:
      description: |-
        Unfurl (link previews)

        Inserts into a message a link preview assembled by the bot itself: a title, a description, and an image. This way the company's internal addresses, which Pachca cannot open on its own, are shown in the conversation as a card.

        The method is available only to a bot whose outgoing webhook is configured for link previews. Such a bot receives the `message_link_shared` event and answers it with this method, and it does not need to belong to the chat with the message — it is enough that the chat is in its workspace.

        The domain of the link must be in the bot's list of allowed ones, and the link itself must be present in the message text, otherwise the method responds with an error. The response comes back empty even when no preview has been applied: the result is checked by reading the message again.
  - target: $.paths['/messages/{id}/link_previews'].post.parameters[?(@.name=='id')]
    update:
      description: Message ID
  - target: $.paths['/messages/{id}/pin'].post
    update:
      description: |-
        Pin message

        Pins a message in the header of a conversation or a channel, where all members see it. There is no limit on the number of pinned messages.

        In threads the method does not work. A message that is already pinned responds `409`, and a deleted one `422`.
  - target: $.paths['/messages/{id}/pin'].post.parameters[?(@.name=='id')]
    update:
      description: Message ID
  - target: $.paths['/messages/{id}/pin'].delete
    update:
      description: |-
        Unpin message

        Removes the pin from a message. If the message was not pinned, the response is still `204`, so a repeated call is safe.
  - target: $.paths['/messages/{id}/pin'].delete.parameters[?(@.name=='id')]
    update:
      description: Message ID
  - target: $.paths['/messages/{id}/reactions'].post
    update:
      description: |-
        Add reaction

        Adds an emoji reaction to a message on behalf of the token owner.

        The `code` field carries the emoji character itself: text notations such as `+1` or `:+1:` are not accepted by the method. If the user has already added the same reaction, it will not be duplicated. To remove a reaction, use the [Delete reaction](DELETE /messages/{id}/reactions) method.

        If there is a thread under the message, the employee who reacted is subscribed to it as well and starts receiving the new messages of the thread.

        **Reaction limits:**

        - Each user can add no more than **20 unique** reactions to a message
        - A message can have no more than **30 unique** reactions
        - The total number of reactions on a message cannot exceed **1000**
  - target: $.paths['/messages/{id}/reactions'].post.parameters[?(@.name=='id')]
    update:
      description: Message ID
  - target: $.paths['/messages/{id}/reactions'].delete
    update:
      description: |-
        Delete reaction

        Removes your own reaction from a message.

        Someone else's reaction and a reaction that does not exist respond `404`. Removing a reaction does not cancel the thread subscription, if it appeared together with the reaction.
  - target: $.paths['/messages/{id}/reactions'].delete.parameters[?(@.name=='id')]
    update:
      description: Message ID
  - target: $.paths['/messages/{id}/reactions'].delete.parameters[?(@.name=='code')]
    update:
      description: "Emoji character of the reaction. The character itself: text forms such as `+1` or `:+1:` are rejected as an unknown emoji."
  - target: $.paths['/messages/{id}/reactions'].delete.parameters[?(@.name=='name')]
    update:
      description: Text name of the emoji (used for custom emoji)
  - target: $.paths['/messages/{id}/reactions'].get
    update:
      description: |-
        List reactions

        All reactions on a message and who left them: each record carries a `user_id` and the character itself.

        For a deleted message the list is empty — reactions disappear along with the text and the files.
  - target: $.paths['/messages/{id}/reactions'].get.parameters[?(@.name=='id')]
    update:
      description: Message ID
  - target: $.paths['/messages/{id}/reactions'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of records to return per request
  - target: $.paths['/messages/{id}/reactions'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page` or `meta.paginate.prev_page`)
  - target: $.paths['/messages/{id}/read_member_ids'].get
    update:
      description: |-
        List users who read the message

        Which of the chat members have read the feed up to this message. A flat array of IDs is returned.

        The caller themselves and the author of the message will never be in the list — only the other members are counted. For a message in a thread these are the members of the thread, not of the parent chat.

        The method does not return names. They are fetched with the [Employee info](GET /users/{id}) method for each ID.
  - target: $.paths['/messages/{id}/read_member_ids'].get.parameters[?(@.name=='id')]
    update:
      description: Message ID
  - target: $.paths['/messages/{id}/read_member_ids'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of records to return per request
  - target: $.paths['/messages/{id}/read_member_ids'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page` or `meta.paginate.prev_page`)
  - target: $.paths['/messages/{id}/thread'].post
    update:
      description: |-
        New thread

        Creates a thread under a message — a place to discuss what has been said without cluttering the chat feed. A thread is a separate access: an employee can be invited into it without opening the chat itself to them, and they will see only the thread and the parent message.

        A new thread immediately includes the employee who created it, the author of the message, everyone who added reactions to the message, and the chat members who turned on thread notifications. Anyone mentioned in the parent message — by name or by tag — is added by a background job right after creation, so the first response may not list them yet. Blanket mentions such as `@all` bring nobody into the thread, and a mentioned employee who is not in the chat itself is not picked up either.

        An empty thread is not a conversation yet: send the first message into it right away with the [New message](POST /messages) method and `entity_type: "thread"`. A thread has no name, and it cannot be deleted either through the API or in the app.

        If a thread has already been created for the message, the response will return information about the previously created thread. A thread cannot be created under a message that itself lies in a thread: there are no nested threads in Pachca.
  - target: $.paths['/messages/{id}/thread'].post.parameters[?(@.name=='id')]
    update:
      description: Message ID
  - target: $.paths['/oauth/token/info'].get
    update:
      description: |-
        Token info

        Information about the token the request itself was made with: its scopes, its owner, and the dates it was created and last used. The token itself comes back masked — only the first 8 and the last 4 characters are visible.

        The method requires no scope and answers any valid token, personal or bot. That makes it convenient for checking a token before work: a live one answers `200`, a revoked or expired one `401`, and the list of scopes immediately shows which methods are available to this token.

        Whose token it is can be seen from `user_id`. The owner's full profile is returned by [Own profile](GET /profile).
  - target: $.paths['/profile'].get
    update:
      description: |-
        Own profile

        The profile of the token owner. For a bot token this is the bot's own profile.

        The time zone from here is needed by anyone who turns human deadlines into dates: "by 3 p.m." and "by Friday" are counted in the employee's time zone, not in UTC. An empty value means the workspace time zone.

        Someone else's profile is returned by [Employee info](GET /users/{id}).
  - target: $.paths['/profile/status'].get
    update:
      description: "Own status\n\nThe status of the token owner: the emoji, the title, the expiry, and away mode.\n\nIf no status is set, the method returns `200` and `null` in the response body — with no wrapper object. A status whose `expires_at` has passed may still be returned for a short time until it is cleared, so check `expires_at` on the client side."
  - target: $.paths['/profile/status'].put
    update:
      description: |-
        New own status

        Sets a status for the token owner: an emoji, a caption, and, if needed, an expiry. It is available to a bot as well — the status will be visible on the bot.

        Away mode is turned on by this same method, with the `is_away` flag. `away_message` holds the text shown in the profile and to anyone trying to write to them or mention them. When the `expires_at` moment passes, the whole status is cleared, the mode and that text along with it.

        Only the fields you pass are overwritten. To extend the current status it is enough to send `expires_at` alone.

        An expiry that an employee names in words — "until three", "until the end of the day" — is exactly `expires_at`, not a part of the caption. It is counted in the employee's time zone, and the zone arrives in [Own profile](GET /profile).

        The emoji is required, and there must be exactly one, with no text around it. The caption is required and no longer than 50 characters.
  - target: $.paths['/profile/status'].delete
    update:
      description: |-
        Delete own status

        Removes the status from the token owner, along with away mode and its text. If there was no status, the response is still `204`, so a repeated call is safe.
  - target: $.paths['/profile/avatar'].put
    update:
      description: |-
        Upload own avatar

        Sets or replaces the avatar of the token owner. The file is sent in `multipart/form-data` format, and the response contains only a link to the new image.

        `jpg`, `jpeg`, `png`, and `gif` are accepted, and an animated `gif` must be no larger than 2 MB. The image is scaled down to 1024 by 1024 pixels, and an opaque `png` is stored as `jpg`.

        Another employee's avatar is set by [Upload employee avatar](PUT /users/{user_id}/avatar), and that is available only to the workspace owner and an administrator.
  - target: $.paths['/profile/avatar'].put.requestBody.properties.image
    update:
      description: Avatar image file
  - target: $.paths['/profile/avatar'].delete
    update:
      description: |-
        Delete own avatar

        Removes the avatar of the token owner; the interface then shows initials. If there was no avatar, the response is still `204`.
  - target: $.paths['/search/chats'].get
    update:
      description: |-
        Search chats

        Searches for conversations and channels by name, forgiving typos. It also finds the public chats of the workspace the caller has not joined, and of the private ones only those they belong to.

        Direct messages are not searched by default. Pass `personal=true` and the search will go by the name of the other party rather than by the chat name.

        The method searches names, not content. To find where something was discussed or agreed, use [Search messages](GET /search/messages).
  - target: $.paths['/search/chats'].get.parameters[?(@.name=='query')]
    update:
      description: Search query text
  - target: $.paths['/search/chats'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of results to return per request
  - target: $.paths['/search/chats'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page`)
  - target: $.paths['/search/chats'].get.parameters[?(@.name=='order')]
    update:
      description: Sort direction
  - target: $.paths['/search/chats'].get.parameters[?(@.name=='created_from')]
    update:
      description: Filter by creation date (from)
  - target: $.paths['/search/chats'].get.parameters[?(@.name=='created_to')]
    update:
      description: Filter by creation date (to)
  - target: $.paths['/search/chats'].get.parameters[?(@.name=='active')]
    update:
      description: Filter by chat activity
  - target: $.paths['/search/chats'].get.parameters[?(@.name=='chat_subtype')]
    update:
      description: Filter by chat type
  - target: $.paths['/search/chats'].get.parameters[?(@.name=='personal')]
    update:
      description: Filter by direct chats
  - target: $.paths['/search/messages'].get
    update:
      description: |-
        Search messages

        Searches by message text and by the names of attachments, but only in the chats the token owner belongs to. A public channel they have not joined does not make it into the search, even though its feed can be read. Thread messages are included in the results.

        The words of the query are matched by their forms and by part of a word, and typos are not corrected. A query in quotation marks is searched as an exact phrase, and matching on part of a word does not apply to it.

        By default messages come from newest to oldest. `sort=relevance` switches the results to how well they match the query, where recent messages are still valued higher.
  - target: $.paths['/search/messages'].get.parameters[?(@.name=='query')]
    update:
      description: Search query text
  - target: $.paths['/search/messages'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of results to return per request
  - target: $.paths['/search/messages'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page`)
  - target: $.paths['/search/messages'].get.parameters[?(@.name=='order')]
    update:
      description: Sort direction
  - target: $.paths['/search/messages'].get.parameters[?(@.name=='sort')]
    update:
      description: Sort results by
  - target: $.paths['/search/messages'].get.parameters[?(@.name=='created_from')]
    update:
      description: Filter by creation date (from)
  - target: $.paths['/search/messages'].get.parameters[?(@.name=='created_to')]
    update:
      description: Filter by creation date (to)
  - target: $.paths['/search/messages'].get.parameters[?(@.name=='chat_ids')]
    update:
      description: Filter by chat IDs
  - target: $.paths['/search/messages'].get.parameters[?(@.name=='user_ids')]
    update:
      description: Filter by message author IDs
  - target: $.paths['/search/messages'].get.parameters[?(@.name=='active')]
    update:
      description: Filter by chat activity
  - target: $.paths['/search/users'].get
    update:
      description: |-
        Search employees

        Searches for employees by first and last name, nickname, position, and department. Typos are forgiven only in the first and last name; the other fields need an exact word.

        The method searches by email only for those who can see personal data in the workspace. It does not search by phone at all — for that there is [List employees](GET /users) with the `query` parameter.

        Deleted employees are never found; suspended ones only when a text query is given, and they stand below the rest in the results. Of the bots, only public ones are found.
  - target: $.paths['/search/users'].get.parameters[?(@.name=='query')]
    update:
      description: Search query text
  - target: $.paths['/search/users'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of results to return per request
  - target: $.paths['/search/users'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page`)
  - target: $.paths['/search/users'].get.parameters[?(@.name=='sort')]
    update:
      description: Sort results by
  - target: $.paths['/search/users'].get.parameters[?(@.name=='order')]
    update:
      description: Sort direction
  - target: $.paths['/search/users'].get.parameters[?(@.name=='created_from')]
    update:
      description: Filter by creation date (from)
  - target: $.paths['/search/users'].get.parameters[?(@.name=='created_to')]
    update:
      description: Filter by creation date (to)
  - target: $.paths['/search/users'].get.parameters[?(@.name=='company_roles')]
    update:
      description: Filter by employee roles
  - target: $.paths['/tasks'].post
    update:
      description: |-
        New task

        Creates a task and assigns the employees responsible for it.

        When creating a task, specifying the task type is required: call, meeting, simple reminder, event, or email. No additional description is needed — you simply create a task with the corresponding text. If you specify a task description, it will become the task's text.

        A task must have assignees; if none are specified, you are assigned as the responsible one.

        Any workspace employee can be assigned to a task that is not linked to any entity. You can get the current employee list using the [List employees](GET /users) method. Assignees the caller cannot see are silently dropped: the response is successful but they are not in `performer_ids`, so check the list in the response.

        A task can be linked to a conversation with the `chat_id` field — then, besides the author and the assignees, the members of that conversation see it. Whoever links it must belong to that conversation. Tasks are not created in a channel, in a thread, or in an archived chat.

        Handing a task to somebody else means changing the assignee with [Edit task](PUT /tasks/{id}).

        If a calendar is connected to the workspace or to the profile, the task also appears there as an event.
  - target: $.paths['/tasks'].get
    update:
      description: |-
        List tasks

        The tasks available to the token owner.

        Without the `chat_ids` parameter only your own tasks are returned: those from conversations and channels you are a member of, plus tasks with no chat that you created or that are assigned to you. The `chat_ids` parameter changes the selection — all tasks of the listed chats are returned, including those of other employees.
  - target: $.paths['/tasks'].get.parameters[?(@.name=='status')]
    update:
      description: Filter by state. If the parameter is omitted, tasks in any state are returned.
  - target: $.paths['/tasks'].get.parameters[?(@.name=='chat_ids')]
    update:
      description: Filter by the chats the tasks are attached to. Accessible chats are the ones you are a member of, public conversations and channels of the workspace, and threads available to you through their parent chat. For a multi-guest, public conversations and channels are accessible only if they are a member. The remaining IDs are ignored without an error. Up to 100 IDs.
  - target: $.paths['/tasks'].get.parameters[?(@.name=='performer_ids')]
    update:
      description: Filter by task performers. Up to 100 IDs.
  - target: $.paths['/tasks'].get.parameters[?(@.name=='author_id')]
    update:
      description: Filter by task author
  - target: $.paths['/tasks'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of records to return per request
  - target: $.paths['/tasks'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page` or `meta.paginate.prev_page`)
  - target: $.paths['/tasks/{id}'].get
    update:
      description: |-
        Task info

        The task together with its author, assignees, and the chat it is linked to.

        A task is seen by its author, its assignees, and the members of the chat it is linked to. But membership in the chat is enough only to read it: a task can be changed and deleted only by the author or one of the assignees.
  - target: $.paths['/tasks/{id}'].get.parameters[?(@.name=='id')]
    update:
      description: Task ID
  - target: $.paths['/tasks/{id}'].put
    update:
      description: |-
        Edit task

        Changes a task: only the fields you pass are overwritten.

        Handing a task over to another employee is an edit too: add them to `performer_ids` in place of the previous one.

        A completed task is closed with this same method: `status: "done"` ticks it off and keeps it in the list, `status: "undone"` puts it back to work.

        Available to the author and the assignees. A member of the chat where the task hangs sees it but cannot change it. The link to a chat cannot be changed: to move a task to another chat, delete it and create it again with the `chat_id` you need.
  - target: $.paths['/tasks/{id}'].put.parameters[?(@.name=='id')]
    update:
      description: Task ID
  - target: $.paths['/tasks/{id}'].delete
    update:
      description: |-
        Delete task

        Removes a task for good: it cannot be restored, and it disappears for the assignees as well. If the task went into a connected calendar, the event is deleted there too.

        Available to the author and the assignees. A repeated call responds `404`.

        A completed task can be closed while keeping it in the list with [Edit task](PUT /tasks/{id}) and `status: "done"`.
  - target: $.paths['/tasks/{id}'].delete.parameters[?(@.name=='id')]
    update:
      description: Task ID
  - target: $.paths['/threads/{id}'].get
    update:
      description: |-
        Thread info

        The thread's identifiers: its own `id`, the `chat_id` for reading and sending messages, and the message it hangs under. For a standalone thread `message_id` and `message_chat_id` come back as `null`.

        The response carries identifiers only: a thread has no name and no message counter, and what it is about can be seen from the conversation inside. The messages of a thread are read with the [List chat messages](GET /messages) method, and its members with the [List chat members](GET /chats/{id}/members) method, both by the `chat_id` of the thread.

        Access to a thread is broader than the results of [List threads](GET /threads): a thread that opens by `id` may well not appear in the list.
  - target: $.paths['/threads/{id}'].get.parameters[?(@.name=='id')]
    update:
      description: Thread ID
  - target: $.paths['/threads'].post
    update:
      description: |-
        New standalone thread

        Creates a thread that is not linked to anything: a place for a conversation, a dialogue with an agent, or a call that needs no chat of its own. Any employees can be gathered in it.

        No request body is required. The thread creator becomes its only member, and the `message_id` and `message_chat_id` fields in the response are returned as `null`. The easiest way to add members to the thread is a mention: `@nickname` or `@tag` at the start or the end of the message text. The [Add users](POST /chats/{id}/members) method by the `chat_id` of the thread works too.

        A thread has no name, so send the first message into it right away — that is how employees will understand what it is about. A thread cannot be deleted. If what needs discussing is a particular message in a chat, start a thread under it with the [New thread](POST /messages/{id}/thread) method, and if a permanent place with a name is needed, use the [New chat](POST /chats) method.
  - target: $.paths['/threads'].get
    update:
      description: |-
        List threads

        Threads available to the token owner.

        Returns threads where you belong either to the thread itself or to the chat it was started in. Belonging to the thread is enough: you do not have to join the chat with the parent message, and standalone threads come as well. Threads from open chats of the workspace you have not joined, however, do not make it into the list, even though those chats are available to you.

        Sorted by the time of the last message in the thread, descending.

        A list item carries neither a title nor any text: only the identifiers of the thread, its chat, and the parent message. To find out what a thread is about, read its messages with [List chat messages](GET /messages) by `chat_id`, and a thread known by its topic is found with [Search messages](GET /search/messages).
  - target: $.paths['/threads'].get.parameters[?(@.name=='last_message_at_after')]
    update:
      description: "Filter by the time of the last message in the thread: threads where it is later than the specified one are returned. The value is in ISO-8601, an offset such as `+03:00` is taken into account, and a time without an offset is treated as UTC."
  - target: $.paths['/threads'].get.parameters[?(@.name=='last_message_at_before')]
    update:
      description: "Filter by the time of the last message in the thread: threads where it is earlier than the specified one are returned. The value is in ISO-8601, an offset such as `+03:00` is taken into account, and a time without an offset is treated as UTC."
  - target: $.paths['/threads'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of records to return per request
  - target: $.paths['/threads'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page` or `meta.paginate.prev_page`)
  - target: $.paths['/uploads'].post
    update:
      description: |-
        Get signature, key and other parameters

        The first step of a file upload: the method issues the storage address and the signed form fields with which the file is uploaded by the next request.

        Nothing is created in Pachca at this point yet: the uploaded file is visible to nobody and linked to nothing. It becomes an attachment when its `key` is passed in the `files` field — to [New message](POST /messages) or [New draft](POST /drafts), and when editing either of them.

        The parameters are issued for one file: request them again for each next one. The signature is valid for 14 days, and the `key` is tied to the token owner, so someone else's key cannot be attached to your own message.
  - target: $.paths['/users'].post
    update:
      description: |-
        New employee

        Creates an employee in the workspace and sends them an invitation by email. Available to the workspace owner and an administrator; the method is not available to a bot.

        If an employee with this email address already exists in the workspace, the response is `409`. A nickname that is already taken is not treated as an error: random characters are silently appended to it, and the response comes back with the modified one.

        You can fill in custom properties for the employee that have been created in your workspace. You can get the current list of employee custom property IDs using the [List custom properties](GET /custom_properties) method.

        The `list_tags` field puts the employee into tags right away, and together with the tags into the chats those tags are linked to. For a guest no tags are assigned at all: the response is successful and `list_tags` in it is empty.

        Through the `chat_ids` parameter the employee can be added to the specified chats right at creation. To create a guest, pass `role: "guest"` — for this role `chat_ids` is required and must contain exactly one active chat the token has permission to add members to. Violating the guest access rules returns `400` with an error on the `chat_ids` field.
  - target: $.paths['/users'].get
    update:
      description: |-
        List employees

        Every employee of the workspace except the deleted ones. Suspended employees come together with the rest and are distinguished by the `suspended` field.

        Bots in the workspace are employees too and come in the common list with `bot: true`. But they are excluded from the results for `query`: to find a bot by name, page through the list without a search query or use [List bots](GET /bots).

        For a multi-guest the method returns not the whole workspace but the people they see in the interface: themselves, members of their shared chats including bots, and public bots. Threads and archived chats do not count as shared.

        Email and phone come back as `null` if the display of personal data is turned off in the workspace and the caller is not an administrator. For a multi-guest they always come back as `null`.

        The profile of a single employee is returned by [Employee info](GET /users/{id}), and your own by [Own profile](GET /profile).
  - target: $.paths['/users'].get.parameters[?(@.name=='query')]
    update:
      description: >-
        Search phrase to filter results. Search works on the following fields: `first_name`, `last_name`, `email`,
        `phone_number`, and `nickname`.
  - target: $.paths['/users'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of records to return per request
  - target: $.paths['/users'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page` or `meta.paginate.prev_page`)
  - target: $.paths['/users/{id}'].get
    update:
      description: |-
        Employee info

        The employee's profile.

        A suspended employee is returned with `suspended: true`, a deleted one as `404`, like a non-existent one. A bot also comes here as an employee, with `bot: true`.

        For a multi-guest the method returns only those who come to them in [List employees](GET /users), and responds `404` for the rest.

        Email and phone come back as `null` if the display of personal data is turned off in the workspace and the caller is not an administrator. For a multi-guest they always come back as `null`. An employee sees their own profile in full — the same one is returned by the [Own profile](GET /profile) method, and without the `users:read` scope.
  - target: $.paths['/users/{id}'].get.parameters[?(@.name=='id')]
    update:
      description: User ID
  - target: $.paths['/users/{id}'].put
    update:
      description: |-
        Edit employee

        Changes the employee's profile: only the fields you pass are overwritten. Custom property IDs are returned by [List custom properties](GET /custom_properties).

        The `list_tags` field replaces the whole set of tags, so send the tags that are being kept along with the new one. A removed tag takes the employee out of the chats this tag brought them into, and a name that does not exist in the workspace yet creates a new tag together with the assignment.

        `suspended: true` suspends the employee: they lose access but remain in chats, tags, and tasks, while `suspended: false` brings them back. An employee is removed for good by [Delete employee](DELETE /users/{id}).

        The workspace owner can be edited only by themselves, and their role can be changed only to administrator. Turning a regular employee into a guest is impossible — in both cases the response is `403`.

        An unknown role value is silently ignored by the method: the response is successful and the role stays as it was.

        A bot's nickname must end with `_bot` and be unique in the workspace, otherwise the method responds `422` with an error on the `nickname` field: `invalid` or `already_exists`. A bot's existing nickname is checked only when it is changed.
  - target: $.paths['/users/{id}'].put.parameters[?(@.name=='id')]
    update:
      description: User ID
  - target: $.paths['/users/{id}'].delete
    update:
      description: |-
        Delete employee

        Removes an employee from the workspace. This cannot be undone: they can be brought back only with a new invitation, and that will already be a different employee.

        What happens: they leave all conversations and channels except direct messages, all tags are taken off them, the tasks where they were the only assignee are deleted, and they are removed from the remaining ones. The messages and files they wrote stay in place.

        The workspace owner cannot be deleted — the method responds `403`. A repeated call responds `404`: the method no longer finds a deleted employee.

        If the employee is going on vacation or the dismissal is not final yet, use [Edit employee](PUT /users/{id}) with `suspended: true`. Suspension is reversible and keeps chats, tags, and tasks.
  - target: $.paths['/users/{id}'].delete.parameters[?(@.name=='id')]
    update:
      description: User ID
  - target: $.paths['/users/{user_id}/status'].get
    update:
      description: "Employee status\n\nThe status of another employee: the emoji, the title, the expiry, and away mode.\n\nFor a multi-guest the method returns statuses only of those who come to them in [List employees](GET /users), and responds `404` for the rest.\n\nIf no status is set, the method returns `200` and `null` in the response body — with no wrapper object. A status whose `expires_at` has passed may still be returned for a short time until it is cleared, so check `expires_at` on the client side."
  - target: $.paths['/users/{user_id}/status'].get.parameters[?(@.name=='user_id')]
    update:
      description: User ID
  - target: $.paths['/users/{user_id}/status'].put
    update:
      description: |-
        New employee status

        Sets a status for another employee — for example, "on vacation" for the time of their absence. Available to the workspace owner and an administrator; not to a bot, even with the scope.

        This same method turns on away mode for that employee with the `is_away` flag and sets the `away_message` text that anyone reaching out to them will see.

        The status is seen by everyone who sees the employee in the workspace. Only the fields you pass are overwritten, so someone else's status can be extended with `expires_at` alone.

        An expiry named in words is `expires_at`, not a part of the caption, and it is counted in the time zone of the employee the status is set for. The emoji is required and there must be exactly one; the caption is required and no longer than 50 characters.

        Your own status is set by the [New own status](PUT /profile/status) method — it is available to all roles and to bots.
  - target: $.paths['/users/{user_id}/status'].put.parameters[?(@.name=='user_id')]
    update:
      description: User ID
  - target: $.paths['/users/{user_id}/status'].delete
    update:
      description: |-
        Delete employee status

        Removes the status from another employee, along with away mode and its text. Available to the workspace owner and an administrator; not to a bot.

        If there was no status, the response is still `204`. Your own status is removed by [Delete own status](DELETE /profile/status).
  - target: $.paths['/users/{user_id}/status'].delete.parameters[?(@.name=='user_id')]
    update:
      description: User ID
  - target: $.paths['/users/{user_id}/avatar'].put
    update:
      description: |-
        Upload employee avatar

        Sets or replaces the avatar of another employee. Available to the workspace owner and an administrator; not to a bot. The workspace owner's avatar can be changed only by themselves.

        The file is sent in `multipart/form-data` format, and the response contains only a link to the new image. `jpg`, `jpeg`, `png`, and `gif` are accepted, an animated `gif` must be no larger than 2 MB, and the image is scaled down to 1024 by 1024 pixels.

        Your own avatar is set by the [Upload own avatar](PUT /profile/avatar) method — it is available to all roles and to bots.
  - target: $.paths['/users/{user_id}/avatar'].put.parameters[?(@.name=='user_id')]
    update:
      description: User ID
  - target: $.paths['/users/{user_id}/avatar'].put.requestBody.properties.image
    update:
      description: Avatar image file
  - target: $.paths['/users/{user_id}/avatar'].delete
    update:
      description: |-
        Delete employee avatar

        Removes the avatar of another employee; the interface then shows initials. Available to the workspace owner and an administrator; not to a bot, and the workspace owner's avatar can be removed only by themselves.

        If there was no avatar, the response is still `204`.
  - target: $.paths['/users/{user_id}/avatar'].delete.parameters[?(@.name=='user_id')]
    update:
      description: User ID
  - target: $.paths['/views/open'].post
    update:
      description: |-
        Open view

        Shows a user a modal window with a form in response to their action. The method is called with a bot token: button click events reach bots only, and the window is opened on behalf of the bot.

        There is only one way to open the window — by the `trigger_id` from the button click event. One `trigger_id` opens one window and lives for 3 seconds: for a bot with a webhook, from the moment Pachca delivered the click, and for a bot with the [Event history](GET /webhooks/events), from the moment the click was written to it. That is why the window is opened first of all, and everything else for the event is done afterwards.

        The filled-in form comes back as a `view_submit` event: to the outgoing webhook, and if no address is set, to the event history. A webhook is answered in the response to it, and Pachca waits 3 seconds for that. An event from the history is closed with [Respond to a form submission](POST /views/{view_id}/submit_response), and there are 5 seconds for that. Miss the window and the user sees a submission error.
  - target: $.paths['/views/{view_id}/submit_response'].post
    update:
      description: |-
        Respond to a form submission

        Closes the form for the employee or shows them errors under the fields. The method is needed by a bot that has no outgoing webhook address set: such a bot has nowhere to answer the webhook, and it receives the `view_submit` event from the [Event history](GET /webhooks/events). If the webhook address is set, answer the webhook directly — that is simpler and does not require polling the history.

        The `view_id` and `submit_id` identifiers arrive in the event payload. You must respond within 5 seconds of the form submission, otherwise the employee sees a submission error and the field values are kept for another attempt.

        A body without the `errors` field closes the form as successfully submitted; with the `errors` field it shows the error text under each named field.

        The response is accepted once. A repeated call with the same `view_id` and `submit_id` pair, as well as a late one, receives `410` with the `submit_expired` code.
  - target: $.paths['/views/{view_id}/submit_response'].post.parameters[?(@.name=='view_id')]
    update:
      description: View ID
  - target: $.paths['/webhooks/events'].get
    update:
      description: |-
        Event history

        The bot's event history: the same thing that goes to the outgoing webhook, but fetched with a request. The method is needed when webhooks cannot be received at your own address — the handler is not reachable from the internet, is not always up, or is being written right now.

        The history is kept only when the "Save event history" option is enabled in the "Outgoing webhook" tab of the bot settings. The webhook address does not have to be specified at all, and if it is specified, the event both goes to it and lands in the history.

        The method works only with a bot token: a personal token has no history of its own. Events are returned from newest to oldest, and an event identifier is a string, not a number.

        The history does not clear itself: delete the events you have read with the [Delete event](DELETE /webhooks/events/{id}) method, otherwise they come again on a repeat request.
  - target: $.paths['/webhooks/events'].get.parameters[?(@.name=='limit')]
    update:
      description: Number of records to return per request
  - target: $.paths['/webhooks/events'].get.parameters[?(@.name=='cursor')]
    update:
      description: Pagination cursor (from `meta.paginate.next_page` or `meta.paginate.prev_page`)
  - target: $.paths['/webhooks/events/{id}'].delete
    update:
      description: |-
        Delete event

        Removes an event from the bot's event history. When working through the history, delete an event right after processing it: the history does not clear itself, and everything left in it comes again on a repeat request.

        The method works only with the token of the bot the event belongs to.
  - target: $.paths['/webhooks/events/{id}'].delete.parameters[?(@.name=='id')]
    update:
      description: Event ID
  - target: $.components.schemas.AccessTokenInfo
    update:
      description: Access token
  - target: $.components.schemas.AccessTokenInfo.properties.id
    update:
      description: Token ID
  - target: $.components.schemas.AccessTokenInfo.properties.token
    update:
      description: Masked token (first 8 and last 4 characters visible)
  - target: $.components.schemas.AccessTokenInfo.properties.name
    update:
      description: "User-defined token name. `null` for a bot token — a name is only set when a token is created manually."
  - target: $.components.schemas.AccessTokenInfo.properties.user_id
    update:
      description: Token owner ID
  - target: $.components.schemas.AccessTokenInfo.properties.scopes
    update:
      description: List of token scopes
  - target: $.components.schemas.AccessTokenInfo.properties.created_at
    update:
      description: Token creation date
  - target: $.components.schemas.AccessTokenInfo.properties.revoked_at
    update:
      description: "Token revocation date. Always `null`: the method returns 401 for a revoked token."
  - target: $.components.schemas.AccessTokenInfo.properties.expires_in
    update:
      description: "Token lifetime in seconds. `null` for a token without an expiry — those are issued by the interface. For a token obtained by signing in from the CLI it is `3600`: it lives for an hour and renews itself."
  - target: $.components.schemas.AccessTokenInfo.properties.last_used_at
    update:
      description: "Token last used date. `null` until the token has been used at least once. Updated at most once per hour, so it may lag behind."
  - target: $.components.schemas.AddMembersRequest
    update:
      description: Request to add members to a chat
  - target: $.components.schemas.AddMembersRequest.properties.member_ids
    update:
      description: Array of user IDs who will become members
  - target: $.components.schemas.AddMembersRequest.properties.silent
    update:
      description: Whether to skip creating a system message about adding members
  - target: $.components.schemas.AddTagsRequest
    update:
      description: Request to add tags to a chat
  - target: $.components.schemas.AddTagsRequest.properties.group_tag_ids
    update:
      description: Array of tag IDs to be added as members
  - target: $.components.schemas.ApiError
    update:
      description: API error (used for 400, 402, 403, 404, 409, 410, 422)
  - target: $.components.schemas.ApiError.properties.errors
    update:
      description: Array of errors
  - target: $.components.schemas.ApiErrorItem
    update:
      description: Detailed error information
  - target: $.components.schemas.ApiErrorItem.properties.key
    update:
      description: Error field key
  - target: $.components.schemas.ApiErrorItem.properties.value
    update:
      description: "Field value that caused the error. `null` if the error does not relate to a specific value."
  - target: $.components.schemas.ApiErrorItem.properties.message
    update:
      description: Error message
  - target: $.components.schemas.ApiErrorItem.properties.code
    update:
      description: Error code
  - target: $.components.schemas.ApiErrorItem.properties.payload
    update:
      description: "Additional error data. Content depends on the error code: `{id: number}` — for custom property errors (property ID), `{record: {type: string, id: number}, query: string}` — for authorization errors, `{draft_id: number}` — when a draft already exists in this chat. In most cases `null`."
  - target: $.components.schemas.AuditDetailsChatId
    update:
      description: 'For: tag_removed_from_chat'
  - target: $.components.schemas.AuditDetailsChatId.properties.chat_id
    update:
      description: Chat ID
  - target: $.components.schemas.AuditDetailsChatPermission
    update:
      description: 'For: chat_permission_changed'
  - target: $.components.schemas.AuditDetailsChatPermission.properties.public_access
    update:
      description: Public access
  - target: $.components.schemas.AuditDetailsChatRenamed
    update:
      description: 'For: chat_renamed'
  - target: $.components.schemas.AuditDetailsChatRenamed.properties.old_name
    update:
      description: Previous chat name
  - target: $.components.schemas.AuditDetailsChatRenamed.properties.new_name
    update:
      description: New chat name
  - target: $.components.schemas.AuditDetailsDeviceAuthorizationApproved
    update:
      description: 'For: oauth_device_authorization_approved'
  - target: $.components.schemas.AuditDetailsDeviceAuthorizationApproved.properties.client_id
    update:
      description: ID of the OAuth client that was allowed to sign in
  - target: $.components.schemas.AuditDetailsDeviceAuthorizationApproved.properties.scopes
    update:
      description: Scopes the employee agreed to
  - target: $.components.schemas.AuditDetailsDeviceAuthorizationDenied
    update:
      description: 'For: oauth_device_authorization_denied'
  - target: $.components.schemas.AuditDetailsDeviceAuthorizationDenied.properties.client_id
    update:
      description: ID of the OAuth client that was denied the sign-in
  - target: $.components.schemas.AuditDetailsDeviceAuthorizationDenied.properties.scopes
    update:
      description: Scopes the client requested
  - target: $.components.schemas.AuditDetailsDlp
    update:
      description: 'For: dlp_violation_detected'
  - target: $.components.schemas.AuditDetailsDlp.properties.dlp_rule_id
    update:
      description: DLP rule ID
  - target: $.components.schemas.AuditDetailsDlp.properties.dlp_rule_name
    update:
      description: DLP rule name
  - target: $.components.schemas.AuditDetailsDlp.properties.message_id
    update:
      description: Message ID
  - target: $.components.schemas.AuditDetailsDlp.properties.chat_id
    update:
      description: Chat ID
  - target: $.components.schemas.AuditDetailsDlp.properties.user_id
    update:
      description: User ID
  - target: $.components.schemas.AuditDetailsDlp.properties.action_message
    update:
      description: Action description. `null` if the rule action has no text set.
  - target: $.components.schemas.AuditDetailsDlp.properties.conditions_matched
    update:
      description: Rule conditions check result (true — conditions matched)
  - target: $.components.schemas.AuditDetailsEmpty
    update:
      description: "Empty details. For: user_login, user_logout, user_2fa_fail, user_2fa_success, user_2fa_disabled, user_created, user_deleted, chat_created, message_created, message_updated, message_deleted, reaction_created, reaction_deleted, thread_created, audit_events_accessed, company_chats_accessed, company_bots_accessed."
  - target: $.components.schemas.AuditDetailsInitiator
    update:
      description: 'For: user_added_to_tag, user_removed_from_tag, user_chat_leave'
  - target: $.components.schemas.AuditDetailsInitiator.properties.initiator_id
    update:
      description: Action initiator ID
  - target: $.components.schemas.AuditDetailsInviter
    update:
      description: 'For: user_chat_join'
  - target: $.components.schemas.AuditDetailsInviter.properties.inviter_id
    update:
      description: Inviter ID
  - target: $.components.schemas.AuditDetailsKms
    update:
      description: 'For: kms_encrypt, kms_decrypt'
  - target: $.components.schemas.AuditDetailsKms.properties.chat_id
    update:
      description: Chat ID
  - target: $.components.schemas.AuditDetailsKms.properties.message_id
    update:
      description: Message ID
  - target: $.components.schemas.AuditDetailsKms.properties.reason
    update:
      description: Operation reason
  - target: $.components.schemas.AuditDetailsRoleChanged
    update:
      description: 'For: user_role_changed'
  - target: $.components.schemas.AuditDetailsRoleChanged.properties.new_company_role
    update:
      description: New role
  - target: $.components.schemas.AuditDetailsRoleChanged.properties.previous_company_role
    update:
      description: Previous role
