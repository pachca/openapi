schema_version: "1.1"
name: act-direct-message
description: "An action through the MCP server, checked against mocks"
tags: [action, pachca-messaging]
runs: 3
execution:
  prompt: "Напиши Вере Соколовой в личку в Пачке: «Созвон переносим на 15:00»"
  max_turns: 10
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: sent
    type: regex
    target: "mock_calls"
    pattern: "pachca_send_message"
