schema_version: "1.1"
name: know-bot-drafts
description: "What pachca-ai-agent adds: answered with the plugin and without it"
tags: [knowledge, pachca-ai-agent]
runs: 3
execution:
  prompt: "Может ли бот-агент в Пачке создать черновик сообщения в поле ввода сотрудника?"
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: answer
    type: llm
    criteria: "PASS if the answer says no: drafts need the employee's own personal token, a bot token gets 403 on drafts. FAIL if it says the bot can create drafts with its own token."
