schema_version: "1.1"
name: know-chrono-order
description: "What pachca-search adds: answered with the plugin and without it"
tags: [knowledge, pachca-search]
runs: 3
execution:
  prompt: "Как прочитать тред Пачки по порядку, от старых сообщений к новым, через MCP?"
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: answer
    type: llm
    criteria: "The answer is advice: no tool calls are expected. PASS if it tells the reader to read the thread's chat feed (pachca_list_chat_messages) with order=asc, with or without sort=id, on every call, cursor pages included, or to read it newest first and reverse the result. The REST form sort[id]=asc is not sort=id with order=asc: the MCP tool takes sort and order as two separate arguments. Message search with order=asc and its default sort is fine too. FAIL if it claims order without sort is ignored, or says the chat feed keeps its order on cursor pages without order passed again."
