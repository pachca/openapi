schema_version: "1.1"
name: know-codex-connect
description: "What pachca adds: answered with the plugin and without it"
tags: [knowledge, pachca]
runs: 3
execution:
  prompt: "Как подключить MCP-сервер Пачки в Codex?"
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: answer
    type: llm
    criteria: "PASS if the answer connects with browser sign-in as the main way: `codex mcp add pachca --url https://mcp.pachca.com/mcp`, which opens the browser for sign-in, with `codex mcp login pachca` to sign in again. With the Pachca plugin installed it still adds the server by hand, since Codex limits the plugin's server to 64 KB of tool descriptions and hides most Pachca tools. It may offer a personal token kept in an environment variable as the fallback, for example `--bearer-token-env-var PACHCA_TOKEN` for CI or when sign-in fails. FAIL if it says browser sign-in does not work in Codex, gives the token as the only way, or puts the token value into a file in the repository."
