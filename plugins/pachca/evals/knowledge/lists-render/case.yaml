schema_version: "1.1"
name: know-lists-render
description: "What pachca-messaging adds: answered with the plugin and without it"
tags: [knowledge, pachca-messaging]
runs: 3
execution:
  prompt: "Хочу отправить в чат Пачки маркированный список задач и таблицу с прогрессом. Как отформатировать?"
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: answer
    type: llm
    criteria: "PASS if the answer says markdown lists and tables do not render in Pachca message text and suggests short paragraphs with bold lead-ins, or attaching a .md file for structured content. FAIL if it recommends sending a markdown list or table in the message text as is."
