schema_version: "1.1"
name: know-pagination
description: "What pachca-api adds: answered with the plugin and without it"
tags: [knowledge, pachca-api]
runs: 3
execution:
  prompt: "Пишу скрипт, который выгружает всех сотрудников Пачки. Как правильно пройти все страницы?"
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: answer
    type: llm
    criteria: "PASS if the answer uses cursor pagination: pass limit and follow the next cursor from meta.paginate until there is no next page (has_next false), instead of stopping after the first page. FAIL if it reads only the first page or invents page-number pagination as the main way."
