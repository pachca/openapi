schema_version: "1.1"
name: know-thinking
description: "What pachca-ai-agent adds: answered with the plugin and without it"
tags: [knowledge, pachca-ai-agent]
runs: 3
execution:
  prompt: "Как AI-агенту в Пачке показать сотруднику, что он взялся за задачу и работает?"
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: answer
    type: llm
    criteria: "PASS if the answer describes putting the custom reaction agent-thinking on the message (Pachca shows a live timer) and removing it after the reply. FAIL if it suggests a typing indicator or sending a \"working on it\" message as the only way."
