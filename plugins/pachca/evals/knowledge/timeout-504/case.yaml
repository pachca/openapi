schema_version: "1.1"
name: know-timeout-504
description: "What pachca-api adds: answered with the plugin and without it"
tags: [knowledge, pachca-api]
runs: 3
execution:
  prompt: "Поиск сообщений в API Пачки вернул 504 с кодом timeout. Повторить запрос?"
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: answer
    type: llm
    criteria: "PASS if the answer's first advice is to narrow the query (for example fewer chats or a shorter period) instead of repeating the same request, because the same request will likely time out again. FAIL if it advises repeating the same request, at once or with backoff, as the first step or the fix, even when it offers narrowing only as a fallback after further timeouts."
