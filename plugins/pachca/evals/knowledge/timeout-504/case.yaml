schema_version: "1.1"
name: know-timeout-504
description: "What pachca-api adds: answered with the plugin and without it"
tags: [knowledge, pachca-api]
runs: 3
execution:
  prompt: "Поиск сообщений в API Пачки вернул 504 с кодом timeout. Повторить запрос?"
  max_turns: 6
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: answer
    type: llm
    criteria: "PASS if the answer says to narrow the query (by chats or period) rather than just retry, because a retry will likely time out again. FAIL if it recommends plain retries with backoff as the fix."
