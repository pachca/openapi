schema_version: "1.1"
name: route-pachca-ai-agent-03
description: "Routes to pachca-ai-agent, no sibling skill fires"
tags: [routing, pachca-ai-agent]
runs: 3
execution:
  prompt: "Агент-бот должен читать весь тред перед ответом, как это сделать?"
  max_turns: 3
  allowed_tools: [Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?(?:pachca-ai-agent)\""
  - name: no-sibling
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?pachca-(?!ai-agent\")[a-z-]+\""
    min: 0
    max: 0
    arm: both
