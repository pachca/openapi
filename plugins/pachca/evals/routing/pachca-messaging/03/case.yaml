schema_version: "1.1"
name: route-pachca-messaging-03
description: "Routes to pachca-messaging, no sibling skill fires"
tags: [routing, pachca-messaging]
runs: 3
execution:
  prompt: "Подготовь черновик ответа в чат «Продажи», я сам проверю и отправлю"
  max_turns: 3
  allowed_tools: [Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?(?:pachca-messaging|announce)\""
  - name: no-sibling
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?pachca-(?!messaging\")[a-z-]+\""
    min: 0
    max: 0
    arm: both
