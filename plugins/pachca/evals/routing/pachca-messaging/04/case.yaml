schema_version: "1.1"
name: route-pachca-messaging-04
description: "Routes to pachca-messaging, no sibling skill fires"
tags: [routing, pachca-messaging]
runs: 3
execution:
  prompt: "Напоминай каждый понедельник в 10:00 в канал дежурных про ротацию"
  max_turns: 3
  allowed_tools: [Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?(?:pachca-messaging|announce)\""
  - name: no-sibling
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?pachca-(?!messaging\")[a-z-]+\""
    min: 0
    max: 0
    arm: both
