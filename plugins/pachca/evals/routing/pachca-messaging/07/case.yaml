schema_version: "1.1"
name: route-pachca-messaging-07
description: "Routes to pachca-messaging, no sibling skill fires"
tags: [routing, pachca-messaging]
runs: 3
execution:
  prompt: "Post to the #general channel in Pachca that the office is closed tomorrow"
  max_turns: 3
  allowed_tools: [Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?(?:pachca-messaging)\""
  - name: no-sibling
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?pachca-(?!messaging\")[a-z-]+\""
    min: 0
    max: 0
    arm: both
  - name: no-command
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:pachca:)?(?:catch-up|thread-summary|digest|announce|tasks-from|watch-thread)\""
    min: 0
    max: 0
    arm: both
