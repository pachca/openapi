schema_version: "1.1"
name: route-pachca-search-04
description: "Routes to pachca-search, no sibling skill fires"
tags: [routing, pachca-search]
runs: 3
execution:
  prompt: "Кто в Пачке отвечает за бухгалтерию? Найди сотрудника"
  max_turns: 3
  allowed_tools: [Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?(?:pachca-search)\""
  - name: no-sibling
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?pachca-(?!search\")[a-z-]+\""
    min: 0
    max: 0
    arm: both
  - name: no-command
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:pachca:)?(?:catch-up|thread-summary|digest|announce|tasks-from|watch-thread)\""
    min: 0
    max: 0
    arm: both
