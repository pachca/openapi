schema_version: "1.1"
name: route-pachca-search-06
description: "Routes to pachca-search, no sibling skill fires"
tags: [routing, pachca-search]
runs: 3
execution:
  prompt: "Покажи мои напоминания в Пачке на эту неделю"
  max_turns: 3
  allowed_tools: [Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?(?:pachca-search)\""
  - name: no-sibling
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?pachca-(?!search\")[a-z-]+\""
    min: 0
    max: 0
    arm: both
  - name: no-command
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:pachca:)?(?:summarize-thread|watch-thread|post-changes|request-review)\""
    min: 0
    max: 0
    arm: both
