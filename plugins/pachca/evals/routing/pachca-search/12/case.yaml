schema_version: "1.1"
name: route-pachca-search-12
description: "Routes to pachca-search, no sibling skill fires"
tags: [routing, pachca-search]
runs: 3
execution:
  prompt: "В чём проблема по треду https://app.pachca.com/chats?thread_id=2002? Объясни простыми словами"
  max_turns: 3
  allowed_tools: [Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?(?:pachca-search)\""
  - name: no-sibling
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?pachca-(?!search\")[a-z-]+\""
    min: 0
    max: 0
    arm: both
