schema_version: "1.1"
name: route-pachca-08
description: "Routes to pachca, no sibling skill fires"
tags: [routing, pachca]
runs: 3
execution:
  prompt: "У меня два пространства в Пачке, как подключить оба к агенту?"
  max_turns: 3
  allowed_tools: [Skill]
graders:
  - name: fires
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?(?:pachca)\""
  - name: no-sibling
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?pachca-[a-z-]+\""
    min: 0
    max: 0
    arm: both
